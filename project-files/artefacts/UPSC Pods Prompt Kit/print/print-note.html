<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pods Printable Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martel:wght@400;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  /* One A4 page. Prints cleanly in black and white: colour is only ever a tint behind dark text. */
  :root {
    --paper: #FFFFFF; --ink: #201B17; --muted: #5E5248; --line: #D9CBBE;
    --chai: #8D4F01; --chaiSoft: #FCEBDB; --teal: #14696B; --tealSoft: #E3F1F0;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #EDE6DF; color: var(--ink); }
  body { font: 400 10.5pt/1.38 Mukta, system-ui, sans-serif; }
  .sheet {
    width: 210mm; height: 297mm; margin: 12px auto; background: var(--paper);
    padding: 11mm 12mm 0; display: flex; flex-direction: column; position: relative;
    box-shadow: 0 2px 14px rgba(0,0,0,.12); overflow: hidden;
  }
  @media print {
    html, body { background: #fff; }
    .sheet { margin: 0; box-shadow: none; }
    .tools { display: none !important; }
  }
  @media screen and (max-width: 820px) {
    .sheet { transform-origin: top left; }
  }
  h1, h2, h3 { font-family: Martel, Georgia, serif; margin: 0; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8mm; }
  .kicker { font: 600 8pt Mukta; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
  .syl { color: var(--muted); font-size: 8.5pt; margin-top: 1mm; max-width: 120mm; }
  .edition { text-align: right; font-size: 7.5pt; color: var(--muted); line-height: 1.3; white-space: nowrap; }
  .edition b { color: var(--ink); font-weight: 600; }
  h1 { font-size: 22pt; line-height: 1.12; font-weight: 800; margin: 2.5mm 0 2.5mm; letter-spacing: -.01em; }
  .thirty { background: var(--chaiSoft); border-left: 3px solid var(--chai); padding: 2.6mm 3.5mm; border-radius: 0 2mm 2mm 0; font-size: 10.5pt; }
  .label { font: 700 7.5pt Mukta; letter-spacing: .09em; text-transform: uppercase; color: var(--chai); display: block; margin-bottom: .6mm; }
  h2 { font-size: 11.5pt; font-weight: 700; margin: 3.8mm 0 1.6mm; display: flex; align-items: center; gap: 2mm; }
  h2::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 9.4pt; }
  th { text-align: left; font: 600 8pt Mukta; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 1.5px solid var(--ink); padding: 1.2mm 2mm 1.2mm 0; }
  td { border-bottom: 1px solid var(--line); padding: 1.6mm 2.5mm 1.6mm 0; vertical-align: top; }
  td:first-child { font-weight: 700; font-family: Martel, serif; font-size: 9.6pt; white-space: nowrap; }
  tr:nth-child(even) td { background: #FBF8F5; }
  .timeline td:first-child { color: var(--chai); }
  .flow td:first-child::before { content: counter(step) ". "; counter-increment: step; color: var(--chai); }
  .flow tbody { counter-reset: step; }
  .cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 6mm; }
  .trap { margin-bottom: 2mm; padding-left: 5mm; position: relative; }
  .trap::before { content: "✕"; position: absolute; left: 0; top: 0; font-weight: 700; color: var(--chai); }
  .trap .t { text-decoration: line-through; text-decoration-color: rgba(141,79,1,.55); color: var(--muted); }
  .trap .r { display: block; }
  .trap .r::before { content: "✓ "; color: var(--teal); font-weight: 700; }
  .box { border: 1px solid var(--line); border-radius: 2mm; padding: 2.4mm 3mm; margin-bottom: 2.5mm; }
  .box.teal { background: var(--tealSoft); border-color: transparent; }
  .box.teal .label { color: var(--teal); }
  .angles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; }
  .angle { font-size: 9pt; border-top: 2px solid var(--teal); padding-top: 1.4mm; }
  .angle b { display: block; font: 700 7.5pt Mukta; letter-spacing: .06em; text-transform: uppercase; color: var(--teal); }
  ol.test { margin: 0; padding-left: 5mm; columns: 2; column-gap: 7mm; font-size: 9.4pt; }
  ol.test li { break-inside: avoid; margin-bottom: 1.2mm; }
  .answers { margin-top: 1.5mm; font-size: 7.5pt; color: var(--muted); transform: rotate(180deg); text-align: right; }
  .sources { font-size: 7.2pt; color: var(--muted); margin-top: 2mm; }
  .grow { flex: 1; }
  .side { padding-top: 3.8mm; }
  .fit { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  footer {
    margin: 0 -12mm; padding: 3mm 12mm; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 5mm; font-size: 7.8pt; color: var(--muted);
  }
  .brand { display: flex; align-items: center; gap: 2mm; color: var(--ink); font: 700 9pt Martel, serif; }
  .brand svg { width: 7mm; height: 7mm; }
  .share { text-align: center; line-height: 1.35; }
  .share b { color: var(--ink); font-weight: 600; }
  .qr { display: flex; align-items: center; gap: 2.5mm; text-align: right; line-height: 1.3; }
  .qr .code { width: 17mm; height: 17mm; }
  .qr .code svg { width: 100%; height: 100%; display: block; }
  .draft { position: absolute; top: 4mm; left: 50%; transform: translateX(-50%); font: 600 7pt Mukta; letter-spacing: .1em; color: #B3261E; border: 1px solid #B3261E; padding: .4mm 2mm; border-radius: 1mm; }
  .tools { max-width: 210mm; margin: 12px auto 0; display: flex; gap: 8px; flex-wrap: wrap; font: 500 13px Mukta, sans-serif; padding: 0 16px; }
  .tools button, .tools select { font: inherit; padding: 6px 12px; border: 1px solid #b9ab9d; border-radius: 6px; background: #fff; cursor: pointer; }
  .tools textarea { width: 100%; height: 140px; font: 12px ui-monospace, monospace; display: none; }
  .tools textarea.open { display: block; }
  .err { color: #B3261E; }
</style>
</head>
<body>
<div class="tools">
  <select id="lang" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option></select>
  <button id="pasteBtn" type="button">Paste model output</button>
  <button type="button" onclick="window.print()">Print or save as PDF</button>
  <span id="msg"></span>
  <textarea id="paste" placeholder="Paste a print-note JSON (or the whole {pack, factsToCheck} reply), then press Render"></textarea>
  <button id="renderBtn" type="button" style="display:none">Render</button>
</div>
<div id="root"></div>

<!-- Replace this block with any upsc-pods/print-note@1 pack. -->
<script type="application/json" id="note">
__NOTE_JSON__
</script>

<script>
const BASE = "https://upscpods.app/n/";       // deep link to the same topic in the app (confirm the real path)
const PAPER = { "prelims-gs1": "Prelims GS1", "prelims-csat": "CSAT", "mains-gs1": "Mains GS1", "mains-gs2": "Mains GS2",
  "mains-gs3": "Mains GS3", "mains-gs4": "Mains GS4", "mains-essay": "Essay", "interview": "Interview" };
const UI = {
  en: { thirty: "The 30-second version", traps: "Traps examiners set", hook: "Memory hook", over: "What most notes miss",
        angles: "Use it in Mains", test: "Test yourself", ans: "Answers", src: "Sources",
        share: "<b>Free to print, copy and share.</b> Not for sale.", tag: "Notes worth passing on", scan: "Practise this<br>topic in 3 min", draft: "DRAFT · NOT YET CHECKED" },
  hi: { thirty: "30 सेकंड में", traps: "परीक्षा के जाल", hook: "याद रखने का तरीक़ा", over: "जो ज़्यादातर नोट्स में छूट जाता है",
        angles: "मेन्स में कहाँ लिखें", test: "ख़ुद को परखें", ans: "उत्तर", src: "स्रोत",
        share: "<b>प्रिंट करें, कॉपी करें, बाँटें।</b> बिक्री के लिए नहीं।", tag: "बाँटने लायक़ नोट्स", scan: "यह टॉपिक<br>3 मिनट में प्रैक्टिस करें", draft: "ड्राफ़्ट · अभी जाँचा नहीं गया" }
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const POD = `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="11" r="6" fill="#8D4F01"/><circle cx="9.5" cy="21" r="6" fill="#14696B"/><circle cx="22.5" cy="21" r="6" fill="#C98A0B"/></svg>`;

function qrSvg(url) {
  try { const q = qrcode(0, "M"); q.addData(url); q.make(); return q.createSvgTag({ cellSize: 2, margin: 0, scalable: true }); }
  catch (e) { return `<svg viewBox="0 0 10 10"><rect width="10" height="10" fill="none" stroke="#999"/></svg>`; }
}

function render(n, L) {
  const t = o => esc(o && (o[L] ?? o.en));
  const u = UI[L];
  const c = n.core;
  const draft = !n.review || n.review.status !== "approved";
  const link = BASE + encodeURIComponent(n.id) + "?ref=print&lang=" + L;
  const checked = n.review && n.review.checkedBy ? `Checked by <b>${esc(n.review.checkedBy)}</b>` : "";
  document.documentElement.lang = L;
  return `<article class="sheet">
    ${draft ? `<div class="draft">${u.draft}</div>` : ""}
    <div class="fit">
    <div class="top">
      <div><div class="kicker">${esc(PAPER[n.syllabus.paper] || "")}</div><div class="syl">${t(n.syllabus.line)}</div></div>
      <div class="edition"><b>${esc(n.edition || "")}</b><br>${checked}</div>
    </div>
    <h1>${t(n.title)}</h1>
    <div class="thirty"><span class="label">${u.thirty}</span>${t(n.thirtySeconds)}</div>

    <h2>${t(c.heading)}</h2>
    <table class="${esc(c.layout)}">
      <thead><tr>${c.columns.map(h => `<th>${t(h)}</th>`).join("")}</tr></thead>
      <tbody>${c.rows.map(r => `<tr>${r.map(x => `<td>${t(x)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table>

    <div class="cols">
      <div>
        <h2>${u.traps}</h2>
        ${n.traps.map(x => `<div class="trap"><span class="t">${t(x.trap)}</span><span class="r">${t(x.truth)}</span></div>`).join("")}
      </div>
      <div class="side">
        ${n.memoryHook ? `<div class="box"><span class="label">${u.hook}</span>${t(n.memoryHook)}</div>` : ""}
        <div class="box teal"><span class="label">${u.over}</span>${t(n.overlooked)}</div>
      </div>
    </div>

    <h2>${u.angles}</h2>
    <div class="angles">${n.mainsAngles.map(a => `<div class="angle"><b>${esc(PAPER[a.paper] || a.paper)}</b>${t(a.line)}</div>`).join("")}</div>

    <h2>${u.test}</h2>
    <ol class="test">${n.selfTest.map(q => `<li>${t(q.q)}</li>`).join("")}</ol>
    <div class="answers">${u.ans}: ${n.selfTest.map((q, i) => `${i + 1}. ${t(q.a)}`).join(" · ")}</div>
    <div class="sources">${u.src}: ${n.sources.map(s => esc(s.label)).join("; ")}</div>
    <div class="grow"></div>
    </div>
    <footer>
      <div class="brand">${POD}<span>UPSC Pods</span></div>
      <div class="share">${u.share}<br>${u.tag} · upscpods.app</div>
      <div class="qr"><span>${u.scan}</span><div class="code">${qrSvg(link)}</div></div>
    </footer>
  </article>`;
}

let note;
function show() {
  const L = document.getElementById("lang").value;
  try {
    document.getElementById("root").innerHTML = render(note, L); document.getElementById("msg").textContent = "";
    // Shrink the content (never the footer) until the note fits on one A4 page.
    const sheet = document.querySelector(".sheet"), fit = document.querySelector(".fit");
    let z = 1;
    const over = () => fit.scrollHeight > fit.clientHeight + 1;
    while (over() && z > 0.72) { z -= 0.02; fit.style.zoom = z; }
    if (over()) document.getElementById("msg").innerHTML = '<span class="err">Too long for one page: trim the table or traps.</span>';
  }
  catch (e) { document.getElementById("msg").innerHTML = `<span class="err">Could not render: ${esc(e.message)}</span>`; }
}
function load(text) { const j = JSON.parse(text); note = j.pack || j; show(); }

const params = new URLSearchParams(location.search);
if (params.get("lang") === "hi") document.getElementById("lang").value = "hi";
try { load(document.getElementById("note").textContent); }
catch (e) { document.getElementById("msg").innerHTML = `<span class="err">No note loaded. Paste one.</span>`; }

document.getElementById("lang").onchange = show;
document.getElementById("pasteBtn").onclick = () => {
  document.getElementById("paste").classList.toggle("open");
  const b = document.getElementById("renderBtn"); b.style.display = b.style.display === "none" ? "" : "none";
};
document.getElementById("renderBtn").onclick = () => {
  try { load(document.getElementById("paste").value); } catch (e) { document.getElementById("msg").innerHTML = `<span class="err">That isn't valid JSON: ${esc(e.message)}</span>`; }
};
</script>
</body>
</html>
