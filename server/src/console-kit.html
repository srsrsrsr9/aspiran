<!-- The shared look and helpers for Aspiran's staff pages: /admin, /desk and the coaching-centre console (/institute).
     index.ts puts this in place of the KIT marker comment in each page, so it is inline (the pages' CSP has no 'self' scripts).
     Everything a page shows from the server goes in as text, never as HTML. -->
<style>
  @font-face { font-family:"Martel"; font-weight:800; font-display:swap; src:url(/app/fonts/martel-latin-800-normal.woff2) format("woff2"); unicode-range:U+0000-00FF, U+2000-206F, U+20B9; }

    color-scheme:light;

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

    --brand:#F0A04B; --brand-ink:#1B1205; --brand-soft:#3B2716; --amber:#3B2716; --bar:#E39A4F;
    --ok:#26301C; --okInk:#C4DCB0; --bad:#3D211D; --badInk:#F2B8AE; --warn:#3A2C12; --warnInk:#F3D28E; --info:#1C2A36; --infoInk:#B5CFE8;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  } }

    .k-shell { grid-template-columns:minmax(0, 1fr); }

  /* --- Page heading -------------------------------------------------------------------------------------- */

  .k-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }

  /* --- Tables ------------------------------------------------------------------------------------------------- */

  .k-signin .card { width:min(460px, 100%); padding:28px 28px 22px; }

<script>
"use strict";
/** Kit: the shared helpers. Pages take what they need: const { h, put, toast } = Kit; */
