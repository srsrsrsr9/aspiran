<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aspiran Admin</title>
<!--KIT-->
<style>
  /* Admin-only bits on top of the shared console kit. */
  textarea { width:100%; }
  .keybox { background:var(--warn); color:var(--warnInk); border-radius:10px; padding:12px 14px; margin:8px 0; }
  .notes { border-left:3px solid var(--line2); padding-left:10px; margin:8px 0; font-size:13px; }
  .helplines { background:var(--ok); color:var(--okInk); border-radius:10px; padding:8px 12px; margin-bottom:12px; }
  tr.gap td:first-child { box-shadow:inset 3px 0 0 var(--badInk); }
  label.flag { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); }
  label.flag:first-child { border-top:0; }
  pre { white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:420px; overflow:auto; background:var(--bg); padding:10px; border-radius:8px; }
  #signin label { display:block; font-weight:600; margin:14px 0 4px; }
  #signin .row input { flex:1; min-width:0; width:auto; }
  .flagrow { display:flex; gap:14px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line); }
  .flagrow:first-child { border-top:0; }
  .flagrow .switch { margin-top:2px; }
  /* Older sections open with a plain h2 and lead: give them the page-heading size. */
  .k-main > h2:first-child { font-size:26px; margin-bottom:6px; }
  .k-mini { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px; }
  .k-mini > div { background:var(--bg); border-radius:10px; padding:8px 10px; }
  .k-mini b { display:block; font-size:20px; }
  .k-mini span { font-size:12.5px; color:var(--muted); }
</style>
</head>
<body>
<header class="k-top">
  <a class="k-brand" href="#overview"><span class="k-mark">A</span><span><div class="k-title">Aspiran Admin</div><div class="k-sub">Staff only</div></span></a>
  <nav class="k-links" aria-label="Other staff pages"><a href="/desk">News desk</a><a href="/institute">Coaching centre console</a><a href="/status">Status page</a></nav>
  <div class="k-who" id="who"></div>
</header>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
"use strict";
// --- Helpers: everything from the server goes in as text, never as HTML ---------------------
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const [base, id] = tag.split("#");
  const [name, ...cls] = base.split(".");
  const el = document.createElement(name);
  if (id) el.id = id;
  if (cls.length) el.className = cls.join(" ");
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  put(el, ...kids, true);
  return el;
}
function put(el, ...kids) {
  const append = kids[kids.length - 1] === true;
  if (append) kids.pop(); else el.replaceChildren();
  for (const k of kids.flat(9)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
/** kind: "ok" (goes after 4 s), "err" (stays until closed) or "info". The shared kit draws it. */
const toast = (t, kind = "info") => Kit.toast(t, kind);
/** Server messages are mostly plain already; these are the ones that aren't, plus anything that looks like code. */
function friendly(msg, status) {
  const m = String(msg || "").trim();
  if (m === "Not found") return "That isn't there any more. Reload the page and try again.";
  if (status === 403) return (m && !/^forbidden$/i.test(m) ? m : "Your role can't do that.") + " Ask an admin if you need this.";
  if (status >= 500 || /^[{[<]/.test(m) || !m) return `The server had a problem${status ? " (error " + status + ")" : ""}. Nothing was changed. Try again in a minute; if it keeps happening, tell the owner.`;
  return m;
}
const when = (iso) => (iso ? new Date(iso).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "");
const ago = (iso) => { if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };
const num = (n) => Number(n || 0).toLocaleString("en-IN");

let key = "";
try { key = sessionStorage.getItem("adminKey") || ""; } catch {}
let me = null;

async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch("/admin/api/" + path, {
      method: opts.method || (opts.body ? "POST" : "GET"),
      headers: { "content-type": "application/json", authorization: "Bearer " + key },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch { throw new Error("Can't reach the server. Check your internet connection and try again. Nothing was changed."); }
  if (opts.raw && res.ok) return res;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401 && path !== "me") signOut("Your key stopped working (it may have been replaced or switched off). Sign in again.");
    throw Object.assign(new Error(friendly(data.error || res.statusText, res.status)), { status: res.status });
  }
  return data;
}
/** Runs an action, shows what happened, then redraws the section. */
async function act(fn, done) {
  try { const r = await fn(); if (done) toast(typeof done === "function" ? done(r) : done, "ok"); await show(current); return r; }
  catch (e) { toast(e.message, "err"); }
}
function download(name, text) {
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: name });
  document.body.append(a); a.click(); a.remove();
}
function dialog(...kids) { const d = $("#dlg"); put(d, ...kids, h("div.row", { style: "margin-top:12px;justify-content:flex-end" }, h("button", { onclick: () => d.close() }, "Close"))); d.showModal(); return d; }
const can = (p) => me && me.perms.includes(p);

/** Single-series bar chart with a hover label per bar and a table view underneath (the shared kit draws it). */
const bars = (title, points, fmt = num, o) => Kit.bars(title, points, fmt, o);
function lastDays(n) { const out = []; for (let i = n - 1; i >= 0; i--) out.push(new Date(Date.now() + 5.5 * 3600e3 - i * 864e5).toISOString().slice(0, 10)); return out; }

// --- Sign in --------------------------------------------------------------------------------
let signInNote = null;
function signOut(msg, kind = "err") { key = ""; try { sessionStorage.removeItem("adminKey"); } catch {} me = null; signInNote = msg ? [msg, kind] : null; render(); }
function signInView(msg, kind = "err") {
  const input = h("input", { id: "key", type: "password", autocomplete: "off", spellcheck: "false", placeholder: "Paste your key here" });
  const banner = h("div.banner." + kind, { role: "alert" }, msg || "");
  const btn = h("button.primary", { onclick: () => go() }, "Sign in");
  const say = (t, k = "err") => { banner.className = "banner " + k; put(banner, t); };
  const go = async () => {
    const typed = input.value.trim();
    if (!typed) { say("Type or paste your key first."); input.focus(); return; }
    btn.disabled = true; put(btn, "Checking…");
    key = typed;
    try { me = await api("me"); try { sessionStorage.setItem("adminKey", key); } catch {} render(); }
    catch (e) {
      key = "";
      btn.disabled = false; put(btn, "Sign in");
      say(e.status === 401 ? "That key didn't work. Check that you pasted all of it (a personal key starts with upk_). If it still fails, ask an admin for a new key." : e.message);
    }
  };
  input.addEventListener("keydown", (e) => e.key === "Enter" && go());
  const eye = h("button", { type: "button", "aria-pressed": "false", onclick: () => {
    const show = input.type === "password";
    input.type = show ? "text" : "password"; put(eye, show ? "Hide" : "Show"); eye.setAttribute("aria-pressed", String(show));
  } }, "Show");
  setTimeout(() => input.focus(), 0);
  return h("div.k-signin", {}, h("div.card#signin", {}, h("span.k-mark", {}, "A"), h("h2", {}, "Sign in to Admin"),
    h("p.muted", {}, "Use the personal key an admin made for you under Staff. It starts with upk_. The first time, use the owner key set with wrangler (ADMIN_TOKEN, or EDITOR_TOKEN if there's no ADMIN_TOKEN), then make personal keys under Staff."),
    h("label", { for: "key" }, "Your key"), h("div.row", {}, input, eye), banner,
    h("div.row", { style: "margin-top:12px" }, btn),
    h("p.muted", {}, "The key stays in this browser tab and is forgotten when you close it. Editors can go straight to the ", h("a", { href: "/desk" }, "News desk"), ".")));
}

// --- Sections -------------------------------------------------------------------------------
const GROUPS = [
  ["", [["overview", "Home", "home", "analytics"]]],
  ["Look after people", [["safety", "Safety queue", "shield", "safety"], ["moderation", "Moderation", "flag", "moderate"], ["members", "Members", "users", "members"], ["privacy", "Data requests", "lock", "privacy"]]],
  ["Content", [["content", "Content", "book", "content"], ["announcements", "Announcements", "megaphone", "announce"], ["languages", "Languages", "globe", "staff"]]],
  ["Growth", [["insights", "Insights", "spark", "analytics"], ["analytics", "Daily counts", "chart", "analytics"], ["growth", "Growth", "growth", "analytics"], ["leads", "Website leads", "inbox", "analytics"], ["trytopic", "Try one topic", "target", "analytics"], ["posts", "Daily posts", "calendar", "flags"], ["institutes", "Coaching centres", "building", "staff"]]],
  ["Money", [["payments", "Payments", "coin", "flags"]]],
  ["Running Aspiran", [["flags", "Feature flags", "layers", "flags"], ["llm", "Helpers and usage", "activity", "llm:view"], ["incidents", "Status and incidents", "alert", "incidents"], ["backups", "Backups", "database", "backups"]]],
  ["Team", [["staff", "Staff and roles", "key", "staff"], ["audit", "Audit log", "list", "audit"]]],
];
const SECTIONS = GROUPS.flatMap(([, items]) => items.map(([id, name, , perm]) => [id, name, perm]));
let navCounts = {};
let current = location.hash.slice(1) || "overview";
const views = {};

async function render() {
  const app = $("#app");
  if (!key) { put($("#who")); put(app, signInView(...(signInNote || []))); signInNote = null; return; }
  if (!me) { try { me = await api("me"); } catch (e) { key = ""; try { sessionStorage.removeItem("adminKey"); } catch {} put(app, signInView(e.status === 401 ? "" : e.message)); return; } }
  const ROLE = { admin: "Admin", editor: "Editor", hindi_editor: "Hindi editor", language_editor: "Language editor", moderator: "Moderator" };
  put($("#who"), h("span.k-avatar", {}, Kit.initials(me.name)), h("span.k-name", {}, h("b", {}, me.name), " · " + me.roles.map((r) => ROLE[r] || r).join(", ")),
    h("button.sm.ghost", { onclick: () => signOut("You're signed out.", "ok") }, Kit.icon("out"), "Sign out"));
  const allowed = SECTIONS.filter(([, , p]) => can(p));
  if (!allowed.find(([id]) => id === current)) current = allowed[0]?.[0] || "overview";
  put(app, h("div.k-shell", {}, h("div#nav", {}), h("main.k-main#main", {})));
  drawNav();
  // Badges for what's waiting: safety alerts and reports.
  if (can("analytics")) api("overview").then((o) => { navCounts = { safety: o.openSafety, moderation: o.openReports, incidents: o.activeIncidents }; drawNav(); }).catch(() => {});
  await show(current);
}
function drawNav() {
  const el = $("#nav");
  if (!el) return;
  put(el, Kit.sideNav(GROUPS.map(([label, items]) => ({ label, items: items.filter(([, , , p]) => can(p)).map(([id, name, icon]) => ({ id, label: name, icon, count: navCounts[id] || 0 })) })),
    current, (id) => { if (location.hash.slice(1) === id) show(id); else location.hash = id; }));
}
async function show(id) {
  current = id;
  document.querySelectorAll(".k-nav").forEach((b) => { b.classList.toggle("on", b.dataset.id === id); if (b.dataset.id === id) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const main = $("#main");
  if (!main) return;
  if (!views[id]) { put(main, h("div.card", {}, "There's no section called \"" + id + "\". Pick one from the list.")); return; }
  put(main, Kit.loading());
  try { const v = await views[id](); if (current === id) put(main, v); }
  catch (e) { put(main, h("div.card", {}, h("div.banner.err", {}, "This section didn't load. " + e.message), h("button", { onclick: () => show(id) }, "Try again"))); }
}
window.addEventListener("hashchange", () => show(location.hash.slice(1) || "overview"));

// Home: what needs someone first, then how Aspiran is doing. Counts only, never who.
views.overview = async () => {
  const d = await api("dashboard");
  const K = Kit, A = d.attention, P = d.people, go = (id) => can(SECTIONS.find((x) => x[0] === id)?.[2]) ? () => (location.hash = id) : null;
  const short = (x) => K.day(x.day);
  const needs = [
    A.safety ? { icon: "shield", title: h("b", {}, `${A.safety} safety alert${A.safety === 1 ? "" : "s"} open`), sub: "Follow the crisis protocol. Oldest first.", right: go("safety") && h("button.sm.primary", { onclick: go("safety") }, "Open") } : null,
    A.reports ? { icon: "flag", title: h("b", {}, `${A.reports} report${A.reports === 1 ? "" : "s"} to review`), sub: "Messages members reported in pods or the Commons.", right: go("moderation") && h("button.sm", { onclick: go("moderation") }, "Review") } : null,
    A.incidents ? { icon: "alert", title: h("b", {}, `${A.incidents} open incident${A.incidents === 1 ? "" : "s"}`), sub: "Shown on the status page until resolved.", right: go("incidents") && h("button.sm", { onclick: go("incidents") }, "Open") } : null,
    !A.lastBackup || Date.now() - new Date(A.lastBackup) > 2 * 86400_000 ? { icon: "database", title: h("b", {}, A.lastBackup ? `Last backup ${K.ago(A.lastBackup)}` : "No backup yet"), sub: "The nightly backup should run every day.", right: go("backups") && h("button.sm", { onclick: go("backups") }, "Backups") } : null,
    d.chai.today.waiting ? { icon: "tea", title: h("b", {}, `${d.chai.today.waiting} Chai card${d.chai.today.waiting === 1 ? "" : "s"} waiting on the desk`), sub: d.chai.briefOut ? "Today's brief is out." : "Today's brief isn't out yet.", right: h("a.k-btn", { href: "/desk" }, "News desk") } : null,
  ].filter(Boolean);
  const plusSub = [P && d.plus.web ? `${num(d.plus.web)} web` : null, d.plus.play ? `${num(d.plus.play)} Play` : null, d.plus.trial ? `${num(d.plus.trial)} trial` : null].filter(Boolean).join(" · ") || "none paying yet";
  const I = d.institutes, L = d.leads, H = d.helpers, M = d.money;
  return [
    K.pageHead("Home", `Today, ${K.day(d.today)}. What needs someone first, then how Aspiran is doing.`, h("a.k-btn", { href: "/desk" }, K.icon("news"), "News desk")),
    K.card({ title: "Needs you", sub: needs.length ? `${needs.length} thing${needs.length === 1 ? "" : "s"}` : null },
      needs.length ? K.list(needs) : K.empty({ icon: "check", title: "Nothing waiting", text: "No safety alerts, reports or incidents open, and backups are running." })),
    h("div.section", {}, h("h3", {}, "People"), h("div.tiles", {},
      K.kpi({ label: "Accounts", value: num(P.total), sub: `${num(P.new7)} new this week${P.suspended ? ` · ${num(P.suspended)} suspended` : ""}`, trend: P.signups.map((x) => x.n), go: go("members") }),
      K.kpi({ label: "Active today", value: num(P.active1), sub: `${num(P.active7)} this week · ${num(P.active30)} this month` }),
      K.kpi({ label: "In pods", value: num(P.podMembers), sub: `${num(P.pods)} pods with people`, go: go("growth") }),
      K.kpi({ label: "Plus members", value: num(d.plus.active), sub: plusSub + (d.plus.test ? ` · ${num(d.plus.test)} test` : ""), go: go("payments") }),
      M ? K.kpi({ label: "Money, last 30 days", value: K.inr(M.revenue30), sub: `${num(M.paid30)} paid · ${K.inr(M.revenue)} kept in all${M.refunded ? ` · ${num(M.refunded)} refunded` : ""}`, trend: M.daily.map((x) => x.n), go: go("payments") }) : null)),
    h("div.grid2", { style: "margin-bottom:14px" },
      K.bars("New accounts each day", P.signups.map((x) => ({ label: short(x), v: x.n })), num, { sub: "Last 14 days" }),
      K.card({ title: "Today's Chai", sub: d.chai.briefOut ? "The brief is out." : "The brief isn't out yet.", actions: [h("a.k-btn.sm", { href: "/desk" }, "Open the desk")] },
        h("div.k-mini", {}, [["found", "found"], ["waiting", "waiting"], ["approved", "approved"], ["hindi", "in Hindi"], ["rejected", "dropped"]].map(([k, l]) => h("div", {}, h("b", {}, num(d.chai.today[k])), h("span", {}, l)))),
        h("p.muted", { style: "margin:12px 0 0" }, `Brief out on ${d.chai.published.filter((x) => x.n).length} of the last 14 days.`))),
    h("div.grid2", { style: "margin-bottom:14px" },
      K.card({ title: "Library", sub: "Live and waiting, by kind", actions: [go("content") && h("button.sm", { onclick: go("content") }, "Content")] },
        d.library.length ? h("table", {}, h("tr", {}, h("th", {}, "Kind"), h("th.n", {}, "Live"), h("th.n", {}, "Drafts")), d.library.map((r) => h("tr", {}, h("td", {}, r.kind), h("td.n", {}, num(r.live)), h("td.n", {}, r.drafts ? h("span.chip.warn", {}, num(r.drafts)) : "0"))))
          : K.empty({ icon: "book", title: "Nothing in the library yet" })),
      K.card({ title: "Helpers today", sub: "Chotu, Jeetu, pod friends, drafting and checks", actions: [go("llm") && h("button.sm", { onclick: go("llm") }, "Details")] },
        h("div.k-mini", {}, h("div", {}, h("b", {}, num(H.today.ok)), h("span", {}, "calls")), h("div", {}, h("b", {}, num(H.today.failed)), h("span", {}, "failed or blocked")), h("div", {}, h("b", {}, num(H.today.tokens)), h("span", {}, "tokens")), h("div", {}, h("b", {}, num(H.voiceToday)), h("span", {}, "voice lines"))),
        H.byPurpose.length ? h("table", { style: "margin-top:10px" }, h("tr", {}, h("th", {}, "Last 7 days, by job"), h("th.n", {}, "Calls")), H.byPurpose.map((r) => h("tr", {}, h("td", {}, r.purpose), h("td.n", {}, num(r.n))))) : null)),
    h("div.grid2", { style: "margin-bottom:14px" },
      K.card({ title: "Website leads", actions: [go("leads") && h("button.sm", { onclick: go("leads") }, "All leads")] },
        h("div.k-mini", {}, h("div", {}, h("b", {}, num(L.total)), h("span", {}, "shared something")), h("div", {}, h("b", {}, num(L.withContact)), h("span", {}, "left a number or email")), h("div", {}, h("b", {}, num(L.new7)), h("span", {}, "new this week")), h("div", {}, h("b", {}, num(L.centres)), h("span", {}, `coaching centres${L.centresNew7 ? ` (${L.centresNew7} new)` : ""}`))),
        L.latestCentres.length ? [h("h4", { style: "margin:14px 0 4px" }, "Latest coaching centres"), K.list(L.latestCentres.map((c) => ({ icon: "building", title: c.centre, sub: [c.city, c.students && `${c.students} students`, K.ago(c.at), c.contact ? "left contact" : "no contact"].filter(Boolean).join(" · ") })))] : null),
      K.card({ title: "Coaching centres on Aspiran", sub: I.flagOn ? "The console is on." : "The console is switched off for everyone (flag: institutes).", actions: [go("institutes") && h("button.sm", { onclick: go("institutes") }, "Manage")] },
        h("div.k-mini", {}, h("div", {}, h("b", {}, num(I.total)), h("span", {}, "centres")), h("div", {}, h("b", {}, num(I.active)), h("span", {}, "active")), h("div", {}, h("b", {}, num(I.paused)), h("span", {}, "paused")), h("div", {}, h("b", {}, num(I.students)), h("span", {}, "students")), h("div", {}, h("b", {}, num(I.openDoubts)), h("span", {}, "doubts waiting"))))),
    glanceSection(P),
  ];
};

// Home → "How it's going": marketing, product and content in one look (glance.ts). Worked out at most once an hour
// on the server, so opening Home stays cheap. Loads after the rest of Home. Counts only, never who.
const FEATURE_SHORT = { pod_session: "Pod", pod_message: "Pod chat", chai_read: "Chai", practice_answer: "Practice", mock_start: "Mocks", mock_done: "Mocks finished",
  audio_play: "Listen", note_open: "Notes", video_play: "Videos", review_done: "Daily review", flashcard_session: "Flashcards", answer_submit: "Mains writing",
  pyq_open: "Past papers", prep_minutes: "Focus time", roadmap_built: "Study plan", search: "Search", share: "Sharing" };
const MOMENT_SHORT = { pod_joined: "Joining a pod", close_day: "Closing the day", chotu_chat: "Chotu chat", quiz: "Quiz", roadmap: "Study plan", chai: "Chai" };
function glanceSection(P) {
  const box = h("div.section", {}, h("h3", {}, "How it's going"), Kit.loading());
  const fill = (fresh) => api("glance" + (fresh ? "?fresh=1" : "")).then((g) => put(box, ...glanceView(g, P, () => { put(box, h("h3", {}, "How it's going"), Kit.loading()); fill(true); })))
    .catch((e) => put(box, h("h3", {}, "How it's going"), h("div.banner.err", {}, "Couldn't load the summary. " + e.message)));
  fill(false);
  return box;
}
function glanceView(g, P, refresh) {
  const K = Kit, M = g.marketing, Pr = g.product, C = g.content, p = (v) => (v == null ? "–" : K.pct(v)), n = (v) => (v == null ? "–" : num(v));
  const go = (id) => (can(SECTIONS.find((x) => x[0] === id)?.[2]) ? h("button.sm", { onclick: () => (location.hash = id) }, "Details") : null);
  const week = (arr) => arr.reduce((s, x) => s + x.n, 0);
  const thisWeek = week(P.signups.slice(-7)), lastWeek = week(P.signups.slice(-14, -7));
  const f = M.funnel30;
  const rows = (cols, list, empty) => (list.length ? h("table", { style: "margin-top:8px" }, h("tr", {}, cols.map(([l, , num]) => h(num ? "th.n" : "th", {}, l))), list.map((r) => h("tr", {}, cols.map(([, fn, num]) => h(num ? "td.n" : "td", {}, fn(r))))))
    : h("p.muted", { style: "margin:8px 0 0" }, empty));
  const piece = (label, x) => x.most.length ? [h("h4", { style: "margin:12px 0 0" }, label),
    rows([["Most opened", (r) => r.piece], ["Opened by", (r) => num(r.opened), 1], ["Finished", (r) => p(r.finishedPct), 1]], x.most, ""),
    x.lose.length ? h("p.muted", { style: "margin:4px 0 0" }, "Losing people: " + x.lose.map((r) => `${r.piece} (${p(r.finishedPct)} finish)`).join(", ")) : null] : null;
  const anyPieces = C.notes.most.length || C.audio.most.length || C.videos.most.length;

      const sel = h("select", {}, Object.entries(STATUS).map(([k, v]) => h("option", { value: k, selected: k === l.status ? true : null }, v)));
      const list = h("textarea", { rows: 6, style: "width:100%", lang: l.code }, l.distress.phrases.join("\n"));
      const reviewer = h("input", { placeholder: "Reviewer's name", value: l.distress.reviewedBy || "" });
      const saveList = (reviewed) => act(() => api(`languages/${l.code}/distress`, { body: { phrases: list.value, reviewed, reviewedBy: reviewer.value } }), reviewed ? "Marked reviewed" : "List saved");
      return h("div.card", {},
        h("div.row", {}, h("b", {}, `${l.name} · ${l.native}`), chip, h("span.muted", {}, l.script + " script"),
          h("span", { style: "margin-left:auto" }), sel, h("button", { onclick: () => act(() => api(`languages/${l.code}`, { body: { status: sel.value } }), `${l.name}: ${STATUS[sel.value]}`) }, "Set")),
        l.gaps.length ? h("div", {}, h("div.muted", {}, "Before it can go live:"), h("ul", {}, l.gaps.map((g) => h("li", {}, g)))) : h("p.muted", {}, "Ready to go live."),
        h("details", { open: l.status !== "off" ? true : null }, h("summary", {}, `Distress phrases (${l.distress.phrases.length})`),
          h("p.muted", {}, "One per line, in the script and in Roman letters as people type them. Messages containing any of these get the helpline card and alert the safety queue. These count for safety even before review."),
          list,
          h("div.muted", {}, l.distress.reviewedBy ? `Reviewed by ${l.distress.reviewedBy} on ${l.distress.reviewedOn}. Changing the list clears this.` : (l.distress.note || "Not reviewed yet.")),
          h("div.row", { style: "margin-top:8px" }, h("button", { onclick: () => saveList(false) }, "Save list"), reviewer, h("button.primary", { onclick: () => saveList(true) }, "Save and mark reviewed"))),
        h("div.muted", { style: "font-family:" + l.fonts.replace(/"/g, "'") }, "Fonts: " + l.fonts));
    })];
};

views.backups = async () => {
  const d = await api("backups");
  return [h("h2", {}, "Backups"),
    h("p.lead", {}, "A backup is taken every day at 05:30 IST and the last 30 are kept. Restoring replaces content and community data, never staff, the audit log, privacy requests or settings, and a fresh backup is taken first. Pod chat history isn't included."),
    !d.bound ? h("div.card", {}, "No backup bucket is bound. Check r2_buckets in wrangler.jsonc.") : null,
    h("div.row", { style: "margin-bottom:12px" }, h("button.primary", { onclick: () => act(() => api("backups", { body: {} }), (r) => `Backed up ${num(r.rows)} rows`) }, "Back up now")),
    h("div.card.scroll", {}, d.backups.length ? h("table", {}, h("tr", {}, h("th", {}, "When"), h("th", {}, "Why"), h("th", {}, "Rows"), h("th", {}, "Size"), h("th", {}, "")),
      d.backups.map((b) => h("tr", {}, h("td", {}, when(b.uploaded)), h("td", {}, b.reason), h("td", {}, num(b.rows)), h("td", {}, `${Math.ceil(b.size / 1024)} KB`),
        h("td", {}, h("button", { onclick: async () => { try { const r = await api("backups/file?key=" + encodeURIComponent(b.key), { raw: true }); download(b.key.split("/").pop(), await r.text()); toast("Backup downloaded", "ok"); } catch (e) { toast(e.message, "err"); } } }, "Download"), " ",
          h("button.danger", { onclick: () => { const c = prompt(`Restore the backup from ${when(b.uploaded)}?\n\nContent and community data will be replaced. A backup of the current state is taken first.\n\nType RESTORE to confirm.`); if (c) act(() => api("backups/restore", { body: { key: b.key, confirm: c } }), (r) => `Restored. Taken first: ${r.takenFirst.split("/").pop()}`); } }, "Restore…"))))) : h("p.muted", {}, "No backups yet.")),
    h("p.muted", {}, "Deployed: Cloudflare D1 also keeps 30 days of point-in-time history. `npx wrangler d1 time-travel restore upsc-pods --timestamp=…` rolls the whole database back.")];
};

views.audit = async () => {
  const q = views.audit.q || "";
  const rows = await api("audit?q=" + encodeURIComponent(q));
  return [h("h2", {}, "Audit log"), h("p.lead", {}, "Every change made on the desk, in moderation and here, with who made it. It can't be edited or restored over."),
    h("div.row", { style: "margin-bottom:12px" }, h("input", { placeholder: "Search person or action", value: q, onchange: (e) => { views.audit.q = e.target.value; show("audit"); } })),
    h("div.card.scroll", {}, rows.length ? h("table", {}, h("tr", {}, h("th", {}, "When"), h("th", {}, "Who"), h("th", {}, "What"), h("th", {}, "Details")),
      rows.map((r) => h("tr", {}, h("td.muted", {}, when(r.at)), h("td", {}, r.actor), h("td", {}, r.action), h("td.mono", {}, r.detail || "")))) : h("p.muted", {}, "Nothing yet."))];
};

render();
</script>
</body>
