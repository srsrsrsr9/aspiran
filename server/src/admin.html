<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aspiran Admin</title>
<style>
  :root { --bg:#FFF8F3; --card:#fff; --ink:#221A14; --muted:#6B5D52; --line:#E8DDD3; --brand:#8D4F01; --bar:#B5651D; --amber:#FCE8C3; --ok:#E3F1E1; --okInk:#2E7D32; --bad:#F8E1DE; --badInk:#B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1A1410; --card:#251D17; --ink:#F0E6DD; --muted:#B8A99C; --line:#3A2F27; --brand:#FFB870; --bar:#E8A060; --amber:#4A3712; --ok:#22361F; --okInk:#8BD18F; --bad:#43201B; --badInk:#F2A49B; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Noto Sans Devanagari", sans-serif; }
  header { position:sticky; top:0; z-index:3; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; color:var(--brand); }
  #who { margin-left:auto; font-size:13px; color:var(--muted); }
  .layout { display:grid; grid-template-columns:200px 1fr; max-width:1280px; margin:0 auto; }
  nav { padding:12px 8px; position:sticky; top:52px; align-self:start; }
  nav button { display:block; width:100%; text-align:left; border:0; background:none; padding:7px 10px; border-radius:8px; color:var(--ink); }
  nav button.on { background:var(--amber); font-weight:600; }
  nav .count { float:right; background:var(--badInk); color:#fff; border-radius:999px; font-size:11px; padding:0 7px; }
  @media (max-width:800px) { .layout { grid-template-columns:1fr; } nav { position:static; display:flex; flex-wrap:wrap; gap:4px; } nav button { width:auto; } }
  main { padding:16px; min-width:0; }
  h2 { margin:0 0 4px; font-size:20px; } h3 { margin:16px 0 6px; font-size:16px; }
  p.lead { margin:0 0 16px; color:var(--muted); }
  input, textarea, select, button { font:inherit; color:inherit; }
  input, textarea, select { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; max-width:100%; }
  textarea { width:100%; }
  button { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  @media (prefers-color-scheme: dark) { button.primary { color:#1A1410; } }
  button.danger { border-color:var(--badInk); color:var(--badInk); }
  button:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-bottom:16px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .tile .n { font-size:26px; font-weight:600; }
  .tile .l { font-size:13px; color:var(--muted); }
  .tile.warn { border-color:var(--badInk); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; border-top:0; }
  .scroll { overflow-x:auto; }
  .chip { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:0 8px; font-size:12px; color:var(--muted); margin-right:4px; }
  .chip.ok { background:var(--ok); color:var(--okInk); border-color:transparent; }
  .chip.bad { background:var(--bad); color:var(--badInk); border-color:transparent; }
  .chip.warn { background:var(--amber); color:var(--ink); border-color:transparent; }
  .muted { color:var(--muted); font-size:13px; }
  .mono { font-family:ui-monospace, Consolas, monospace; font-size:12px; word-break:break-all; }
  .keybox { background:var(--amber); border-radius:8px; padding:12px; margin:8px 0; }
  .notes { border-left:3px solid var(--line); padding-left:10px; margin:8px 0; font-size:13px; }
  .quote { background:var(--bg); border-radius:8px; padding:8px 10px; margin:6px 0; white-space:pre-wrap; }
  .helplines { background:var(--ok); border-radius:8px; padding:8px 12px; margin-bottom:12px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:none; gap:10px; align-items:flex-start; z-index:9; width:min(560px, calc(100vw - 32px));
    background:var(--card); color:var(--ink); border:1px solid var(--line); padding:10px 12px 10px 14px; border-radius:10px; font-size:14px; box-shadow:0 4px 18px rgba(0,0,0,.18); }
  #toast.ok { background:var(--ok); color:var(--okInk); border-color:transparent; }
  #toast.err { background:var(--bad); color:var(--badInk); border-color:var(--badInk); }
  #toast .t { flex:1; color:var(--ink); white-space:pre-wrap; word-break:break-word; }
  #toast .ic { font-weight:700; }
  #toast button { border:0; background:none; padding:0 4px; color:inherit; font-size:16px; line-height:1; }
  .banner { border-radius:8px; padding:8px 12px; margin:10px 0; font-size:14px; }
  .banner:empty { display:none; }
  .banner.err { background:var(--bad); color:var(--badInk); }
  .banner.ok { background:var(--ok); color:var(--okInk); }
  .pill { display:inline-block; border-radius:999px; padding:1px 10px; font-size:12px; font-weight:600; white-space:nowrap; }
  .pill.gap { background:var(--bad); color:var(--badInk); }
  .pill.drafts, .pill.hindi { background:var(--amber); color:var(--ink); }
  .pill.ok { background:var(--ok); color:var(--okInk); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  tr.gap td:first-child { border-left:3px solid var(--badInk); }
  .chart { width:100%; height:120px; display:block; }
  .chart .b { fill:var(--bar); }
  .chart .b:hover { opacity:.75; }
  .chart line { stroke:var(--line); }
  .chart text { fill:var(--muted); font-size:11px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:12px; }
  label.flag { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); }
  label.flag:first-child { border-top:0; }
  pre { white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:420px; overflow:auto; background:var(--bg); padding:10px; border-radius:8px; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); max-width:760px; width:calc(100vw - 32px); padding:16px; }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  #signin { max-width:460px; margin:10vh auto; }
  #signin label { display:block; font-weight:600; margin:14px 0 4px; }
  #signin .row input { flex:1; min-width:0; }
  @media (max-width:640px) { .layout nav { flex-wrap:nowrap; overflow-x:auto; } .layout nav button { flex:none; } }
</style>
</head>
<body>
<header>
  <h1>Aspiran Admin</h1>
  <a href="/desk" class="muted">News desk</a>
  <a href="/status" class="muted">Status page</a>
  <span id="who"></span>
</header>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"><span class="ic" aria-hidden="true"></span><span class="t"></span><button type="button" aria-label="Close">×</button></div>
<dialog id="dlg"></dialog>
<script>
"use strict";
// --- Helpers: everything from the server goes in as text, never as HTML ---------------------
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const [base, id] = tag.split("#");
  const [name, ...cls] = base.split(".");
  const el = document.createElement(name);
  if (id) el.id = id;
  if (cls.length) el.className = cls.join(" ");
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  put(el, ...kids, true);
  return el;
}
function put(el, ...kids) {
  const append = kids[kids.length - 1] === true;
  if (append) kids.pop(); else el.replaceChildren();
  for (const k of kids.flat(9)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
/** kind: "ok" (green, goes after 4 s), "err" (red, stays until closed) or "info". */
const toast = (t, kind = "info") => {
  const e = $("#toast");
  e.className = kind;
  e.setAttribute("role", kind === "err" ? "alert" : "status");
  e.querySelector(".ic").textContent = kind === "ok" ? "✓" : kind === "err" ? "!" : "i";
  e.querySelector(".t").textContent = t;
  e.style.display = "flex";
  clearTimeout(toast.t);
  if (kind !== "err") toast.t = setTimeout(() => (e.style.display = "none"), kind === "ok" ? 4000 : 7000);
};
document.querySelector("#toast button").onclick = () => ($("#toast").style.display = "none");
/** Server messages are mostly plain already; these are the ones that aren't, plus anything that looks like code. */
function friendly(msg, status) {
  const m = String(msg || "").trim();
  if (m === "Not found") return "That isn't there any more. Reload the page and try again.";
  if (status === 403) return (m && !/^forbidden$/i.test(m) ? m : "Your role can't do that.") + " Ask an admin if you need this.";
  if (status >= 500 || /^[{[<]/.test(m) || !m) return `The server had a problem${status ? " (error " + status + ")" : ""}. Nothing was changed. Try again in a minute; if it keeps happening, tell the owner.`;
  return m;
}
const when = (iso) => (iso ? new Date(iso).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "");
const ago = (iso) => { if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };
const num = (n) => Number(n || 0).toLocaleString("en-IN");

let key = "";
try { key = sessionStorage.getItem("adminKey") || ""; } catch {}
let me = null;

async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch("/admin/api/" + path, {
      method: opts.method || (opts.body ? "POST" : "GET"),
      headers: { "content-type": "application/json", authorization: "Bearer " + key },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch { throw new Error("Can't reach the server. Check your internet connection and try again. Nothing was changed."); }
  if (opts.raw && res.ok) return res;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401 && path !== "me") signOut("Your key stopped working (it may have been replaced or switched off). Sign in again.");
    throw Object.assign(new Error(friendly(data.error || res.statusText, res.status)), { status: res.status });
  }
  return data;
}
/** Runs an action, shows what happened, then redraws the section. */
async function act(fn, done) {
  try { const r = await fn(); if (done) toast(typeof done === "function" ? done(r) : done, "ok"); await show(current); return r; }
  catch (e) { toast(e.message, "err"); }
}
function download(name, text) {
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: name });
  document.body.append(a); a.click(); a.remove();
}
function dialog(...kids) { const d = $("#dlg"); put(d, ...kids, h("div.row", { style: "margin-top:12px;justify-content:flex-end" }, h("button", { onclick: () => d.close() }, "Close"))); d.showModal(); return d; }
const can = (p) => me && me.perms.includes(p);

/** Single-series bar chart with a hover label per bar and a table view underneath. */
function bars(title, points, fmt = num) {
  const W = 600, H = 120, pad = 18, max = Math.max(1, ...points.map((p) => p.v));
  const bw = (W - 30) / Math.max(points.length, 1);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("class", "chart"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", title);
  const ns = (t, a) => { const e = document.createElementNS("http://www.w3.org/2000/svg", t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
  svg.append(ns("line", { x1: 30, x2: W, y1: H - pad, y2: H - pad }));
  const top = ns("text", { x: 0, y: 10 }); top.textContent = fmt(max); svg.append(top);
  points.forEach((p, i) => {
    const bh = Math.max(p.v ? 2 : 0, ((H - pad - 14) * p.v) / max);
    const x = 30 + i * bw + 1, w = Math.max(bw - 2, 1), y = H - pad - bh;
    // Rounded top, square base on the axis.
    const r = Math.min(4, w / 2, bh);
    const path = ns("path", { d: `M${x},${H - pad} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${H - pad} Z`, class: "b", fill: "var(--bar)" });
    const t = ns("title", {}); t.textContent = `${p.label}: ${fmt(p.v)}`; path.append(t);
    svg.append(path);
    // A bigger invisible hit target than the bar itself.
    const hit = ns("rect", { x: 30 + i * bw, y: 0, width: bw, height: H - pad, fill: "transparent" });
    const t2 = ns("title", {}); t2.textContent = `${p.label}: ${fmt(p.v)}`; hit.append(t2); svg.append(hit);
  });
  if (points.length) {
    const a = ns("text", { x: 30, y: H - 3 }); a.textContent = points[0].label; svg.append(a);
    const b = ns("text", { x: W, y: H - 3, "text-anchor": "end" }); b.textContent = points[points.length - 1].label; svg.append(b);
  }
  return h("div.card", {}, h("div", { style: "font-weight:600" }, title), svg,
    h("details", {}, h("summary.muted", {}, "Table"), h("table", {}, h("tr", {}, h("th", {}, "Day"), h("th", {}, "Value")), points.map((p) => h("tr", {}, h("td", {}, p.label), h("td", {}, fmt(p.v)))))));
}
function lastDays(n) { const out = []; for (let i = n - 1; i >= 0; i--) out.push(new Date(Date.now() + 5.5 * 3600e3 - i * 864e5).toISOString().slice(0, 10)); return out; }

// --- Sign in --------------------------------------------------------------------------------
let signInNote = null;
function signOut(msg, kind = "err") { key = ""; try { sessionStorage.removeItem("adminKey"); } catch {} me = null; signInNote = msg ? [msg, kind] : null; render(); }
function signInView(msg, kind = "err") {
  const input = h("input", { id: "key", type: "password", autocomplete: "off", spellcheck: "false", placeholder: "Paste your key here" });
  const banner = h("div.banner." + kind, { role: "alert" }, msg || "");
  const btn = h("button.primary", { onclick: () => go() }, "Sign in");
  const say = (t, k = "err") => { banner.className = "banner " + k; put(banner, t); };
  const go = async () => {
    const typed = input.value.trim();
    if (!typed) { say("Type or paste your key first."); input.focus(); return; }
    btn.disabled = true; put(btn, "Checking…");
    key = typed;
    try { me = await api("me"); try { sessionStorage.setItem("adminKey", key); } catch {} render(); }
    catch (e) {
      key = "";
      btn.disabled = false; put(btn, "Sign in");
      say(e.status === 401 ? "That key didn't work. Check that you pasted all of it (a personal key starts with upk_). If it still fails, ask an admin for a new key." : e.message);
    }
  };
  input.addEventListener("keydown", (e) => e.key === "Enter" && go());
  const eye = h("button", { type: "button", "aria-pressed": "false", onclick: () => {
    const show = input.type === "password";
    input.type = show ? "text" : "password"; put(eye, show ? "Hide" : "Show"); eye.setAttribute("aria-pressed", String(show));
  } }, "Show");
  setTimeout(() => input.focus(), 0);
  return h("div.card#signin", {}, h("h2", {}, "Sign in to Admin"),
    h("p.muted", {}, "Use the personal key an admin made for you under Staff. It starts with upk_. The first time, use the owner key set with wrangler (ADMIN_TOKEN, or EDITOR_TOKEN if there's no ADMIN_TOKEN), then make personal keys under Staff."),
    h("label", { for: "key" }, "Your key"), h("div.row", {}, input, eye), banner,
    h("div.row", { style: "margin-top:12px" }, btn),
    h("p.muted", {}, "The key stays in this browser tab and is forgotten when you close it. Editors can go straight to the ", h("a", { href: "/desk" }, "News desk"), "."));
}

// --- Sections -------------------------------------------------------------------------------
const SECTIONS = [
  ["overview", "Overview", "analytics"], ["content", "Content", "content"], ["moderation", "Moderation", "moderate"],
  ["safety", "Safety queue", "safety"], ["members", "Members", "members"], ["privacy", "Data requests", "privacy"],
  ["llm", "AI usage", "llm:view"], ["analytics", "Analytics", "analytics"], ["growth", "Growth", "analytics"], ["leads", "Website leads", "analytics"], ["payments", "Payments", "flags"], ["flags", "Feature flags", "flags"],
  ["announcements", "Announcements", "announce"], ["incidents", "Status and incidents", "incidents"],
  ["staff", "Staff and roles", "staff"], ["languages", "Languages", "staff"], ["backups", "Backups", "backups"], ["audit", "Audit log", "audit"],
];
let current = location.hash.slice(1) || "overview";
const views = {};

async function render() {
  const app = $("#app");
  if (!key) { put($("#who")); put(app, signInView(...(signInNote || []))); signInNote = null; return; }
  if (!me) { try { me = await api("me"); } catch (e) { key = ""; try { sessionStorage.removeItem("adminKey"); } catch {} put(app, signInView(e.status === 401 ? "" : e.message)); return; } }
  const ROLE = { admin: "Admin", editor: "Editor", hindi_editor: "Hindi editor", language_editor: "Language editor", moderator: "Moderator" };
  put($("#who"), "Signed in as ", h("b", {}, me.name), ` · ${me.roles.map((r) => ROLE[r] || r).join(", ")} `, h("button", { onclick: () => signOut("You're signed out.", "ok") }, "Sign out"));
  const allowed = SECTIONS.filter(([, , p]) => can(p));
  if (!allowed.find(([id]) => id === current)) current = allowed[0]?.[0] || "overview";
  const nav = h("nav", {}, allowed.map(([id, name]) => h("button", { class: id === current ? "on" : "", "data-id": id, onclick: () => { location.hash = id; } }, name)));
  put(app, h("div.layout", {}, nav, h("main#main", {})));
  await show(current);
}
async function show(id) {
  current = id;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
  const main = $("#main");
  if (!main) return;
  if (!views[id]) { put(main, h("div.card", {}, "There's no section called \"" + id + "\". Pick one from the list.")); return; }
  try { put(main, await views[id]()); }
  catch (e) { put(main, h("div.card", {}, h("div.banner.err", {}, "This section didn't load. " + e.message), h("button", { onclick: () => show(id) }, "Try again"))); }
}
window.addEventListener("hashchange", () => show(location.hash.slice(1) || "overview"));

views.overview = async () => {
  const o = await api("overview");
  const tile = (n, l, warn, go) => h("div.tile" + (warn ? ".warn" : ""), { style: go ? "cursor:pointer" : "", onclick: go ? () => (location.hash = go) : null }, h("div.n", {}, n), h("div.l", {}, l));
  return [h("h2", {}, "Overview"), h("p.lead", {}, `Today (${o.today}).`),
    h("div.tiles", {},
      tile(num(o.openSafety), o.oldestSafety ? `safety alerts open, oldest ${ago(o.oldestSafety)}` : "safety alerts open", o.openSafety > 0, can("safety") && "safety"),
      tile(num(o.openReports), "reports to review", o.openReports > 0, can("moderate") && "moderation"),
      tile(o.briefOut ? "Out" : "Not yet", `today's brief · ${o.cardsApproved} approved, ${o.cardsWaiting} waiting`, false),
      tile(num(o.libraryLive), `library items live · ${o.libraryDrafts} drafts`, false, "content"),
      tile(num(o.members), `members in ${o.pods} pods`, false, can("members") && "members"),
      tile(num(o.aiCallsToday), "AI calls today", false, can("llm:view") && "llm"),
      tile(num(o.activeIncidents), "open incidents", o.activeIncidents > 0, can("incidents") && "incidents"),
      tile(o.lastBackup ? ago(o.lastBackup) : "None", "last backup", !o.lastBackup, can("backups") && "backups")),
    h("div.card", {}, h("b", {}, "Writing and approving content"), h("p.muted", {}, "Cards, the library, mock papers and long reads are written and approved on the "), h("a", { href: "/desk" }, "News desk"), h("span.muted", {}, ". Your key works there too, and approvals carry your name.")),
  ];
};

// Content: one list with history and restore. Writing happens on the desk.
views.content = async () => {
  const q = views.content.q || "";
  const [d, cov] = await Promise.all([api("content?q=" + encodeURIComponent(q)), api("coverage")]);
  const search = h("input", { placeholder: "Search titles", value: q, onchange: (e) => { views.content.q = e.target.value; show("content"); } });
  const status = (r) => [r.en_editor ? h("span.chip.ok", {}, "EN ✓ " + r.en_editor) : h("span.chip", {}, r.status), r.hi_editor ? h("span.chip.ok", {}, "HI ✓ " + r.hi_editor) : null];
  const histBtn = (type, id, n) => h("button", { onclick: () => history(type, id) }, `History (${n})`);
  return [h("h2", {}, "Content"), h("p.lead", {}, "Every card and library item, with its full history. Restoring an old version brings it back as a draft that needs approving again. To write or approve, use the News desk."),
    h("div.row", { style: "margin-bottom:12px" }, search, h("a", { href: "/desk" }, h("button.primary", {}, "Open the News desk"))),
    coverageCard(cov),
    h("h3", {}, "Chai cards"),
    h("div.card.scroll", {}, h("table", {}, h("tr", {}, h("th", {}, "Day"), h("th", {}, "Headline"), h("th", {}, "Status"), h("th", {}, "")),
      d.cards.map((r) => h("tr", {}, h("td", {}, r.day), h("td", {}, r.headline || r.title), h("td", {}, status(r)), h("td", {}, histBtn("card", r.id, r.versions)))))),

        live || a.starts_at > now ? h("button", { onclick: () => act(() => api(`announcements/${a.id}/withdraw`, { body: {} }), "Withdrawn") }, "Withdraw") : null);
    })];
};

  return [h("h2", {}, "Status and incidents"),
    h("p.lead", {}, ["The public ", h("a", { href: "/status", target: "_blank" }, "/status"), " page checks the service live. Post an incident here when something's wrong or planned; it shows there straight away."]),
    h("div.card", {}, f.title, h("div.row", { style: "margin:8px 0" }, f.comp, f.impact), f.msg,
      h("div.row", { style: "margin-top:8px" }, h("button.primary", { onclick: () => act(() => api("incidents", { body: { title: f.title.value, component: f.comp.value, impact: f.impact.value, message: f.msg.value } }), "Posted on the status page") }, "Post incident"))),

        !i.resolved_at ? h("div.row", {}, st, m, h("button", { onclick: () => act(() => api("incidents/" + i.id, { body: { status: st.value, message: m.value } }), "Updated") }, "Post update")) : null);
    })];
};

views.staff = async () => {
  const d = await api("staff");
  const roleBoxes = (have = []) => Object.fromEntries(Object.keys(d.roles).map((r) => [r, h("input", { type: "checkbox", checked: have.includes(r) })]));
  const nb = roleBoxes(["editor"]);
  const langBoxes = (have = []) => Object.fromEntries(d.languages.map((l) => [l.code, h("input", { type: "checkbox", checked: have.includes(l.code) })]));
  const picked = (boxes) => Object.keys(boxes).filter((k) => boxes[k].checked);
  const langRow = (boxes) => h("div.row.muted", {}, "Languages they approve (for language editors):", d.languages.map((l) => h("label.row", {}, boxes[l.code], l.name)));
  const nl = langBoxes();
  const name = h("input", { placeholder: "Full name (shows on approvals)" }), email = h("input", { placeholder: "Email (optional, for your records)" });
  const showKey = (who, k) => dialog(h("h3", {}, `Personal key for ${who}`),
    h("div.keybox", {}, h("div.mono", {}, k), h("button", { style: "margin-top:8px", onclick: () => navigator.clipboard.writeText(k).then(() => toast("Copied", "ok"), () => toast("Couldn't copy. Select the key and copy it by hand.", "err")) }, "Copy")),
    h("p", {}, "This is the only time it's shown. Give it to them in person or through a password manager, not in chat or email."),
    h("p.muted", {}, "They sign in here and on the News desk with it. Lost keys can't be recovered; make a new one."));
  return [h("h2", {}, "Staff and roles"),
    h("p.lead", {}, "Everyone gets their own key, so approvals carry their real name and every change is in the audit log."),
    h("div.card", {}, Object.entries(d.roles).map(([r, desc]) => h("div.muted", {}, desc))),
    h("h3", {}, "Add a person"),
    h("div.card", {}, h("div.row", {}, name, email), h("div.row", { style: "margin-top:8px" }, Object.entries(nb).map(([r, b]) => h("label.row", {}, b, r.replace("_", " ")))), langRow(nl),
      h("div.row", { style: "margin-top:8px" }, h("button.primary", { onclick: async () => {
        try { const r = await api("staff", { body: { name: name.value, email: email.value, roles: picked(nb), langs: picked(nl) } }); showKey(name.value, r.key); show("staff"); } catch (e) { toast(e.message, "err"); }
      } }, "Create and show their key"))),
    h("h3", {}, "People"),
    h("div.card.scroll", {}, d.staff.length ? h("table", {}, h("tr", {}, h("th", {}, "Name"), h("th", {}, "Roles"), h("th", {}, "Last active"), h("th", {}, "")),
      d.staff.map((p) => {
        const boxes = roleBoxes(p.roles), lb = langBoxes(p.langs);
        return h("tr", { style: p.disabled_at ? "opacity:.5" : "" },
          h("td", {}, p.name, h("div.muted", {}, p.email || ""), h("div.muted", {}, `added by ${p.created_by} · ${when(p.created_at)}`)),
          h("td", {}, Object.entries(boxes).map(([r, b]) => h("label.row", {}, b, r.replace("_", " "))), langRow(lb),
            h("button", { onclick: () => act(() => api(`staff/${p.id}/roles`, { body: { roles: picked(boxes), langs: picked(lb) } }), "Roles saved") }, "Save roles")),
          h("td.muted", {}, p.last_seen_at ? ago(p.last_seen_at) : "never"),
          h("td", {}, p.disabled_at ? h("button", { onclick: () => act(() => api(`staff/${p.id}/enable`, { body: {} }), "Re-enabled") }, "Re-enable")
            : [h("button", { onclick: async () => { if (!confirm("Make a new key? Their old key stops working now.")) return; try { const r = await api(`staff/${p.id}/rotate`, { body: {} }); showKey(p.name, r.key); } catch (e) { toast(e.message, "err"); } } }, "New key"), " ",
              h("button.danger", { onclick: () => { if (confirm(`Disable ${p.name}? Their key stops working now. Their approvals and history stay.`)) act(() => api(`staff/${p.id}/disable`, { body: {} }), "Disabled"); } }, "Disable")]));
      })) : h("p.muted", {}, "Nobody yet. Until you add people, everyone is using shared keys."))];

views.languages = async () => {
  const [d, rq] = await Promise.all([api("languages"), api("language-requests")]);
  const STATUS = { off: "Off", pilot: "Pilot (desk only)", live: "Live (members see it)" };
  const top = Math.max(1, ...rq.languages.map((l) => l.requests));
  return [h("h2", {}, "Languages"),
    h("div.card", {},
      h("h3", { style: "margin-top:0" }, "Requested by members"),
      h("p.muted", {}, `What people tapped under "Request your language" in the apps, one count per device per language (${num(rq.devices)} ${rq.devices === 1 ? "device" : "devices"} so far). No names or member ids are kept. "Would help" means they ticked "I'd help translate".`),
      h("table", {}, h("tr", {}, h("th", {}, "Language"), h("th", {}, "Requests"), h("th", {}, ""), h("th", {}, "Last 7 days"), h("th", {}, "Would help")),
        rq.languages.map((l) => h("tr", {},
          h("td", {}, l.name, l.native !== l.name ? [" · ", h("span", { lang: l.code }, l.native)] : null),
          h("td", {}, num(l.requests)),
          h("td", { style: "width:40%" }, h("div", { style: `height:8px;border-radius:4px;background:var(--bar);width:${Math.round((l.requests / top) * 100)}%;min-width:${l.requests ? 4 : 0}px` })),
          h("td", {}, num(l.lastWeek)),
          h("td", {}, num(l.helpers)))))),
    h("p.lead", {}, "English and Hindi are written inside every item. Other languages are translated per item on the desk and approved by a language editor. A language goes live for members only when it has an approving editor and a reviewed list of distress phrases."),
    d.languages.map((l) => {
      const chip = h("span.chip" + (l.status === "live" ? ".ok" : l.status === "pilot" ? ".warn" : ""), {}, STATUS[l.status]);
      if (l.inPack) return h("div.card", {}, h("div.row", {}, h("b", {}, `${l.name} · ${l.native}`), chip, h("span.muted", {}, "Built in, always on.")));
      const sel = h("select", {}, Object.entries(STATUS).map(([k, v]) => h("option", { value: k, selected: k === l.status ? true : null }, v)));
      const list = h("textarea", { rows: 6, style: "width:100%", lang: l.code }, l.distress.phrases.join("\n"));
      const reviewer = h("input", { placeholder: "Reviewer's name", value: l.distress.reviewedBy || "" });
      const saveList = (reviewed) => act(() => api(`languages/${l.code}/distress`, { body: { phrases: list.value, reviewed, reviewedBy: reviewer.value } }), reviewed ? "Marked reviewed" : "List saved");
      return h("div.card", {},
        h("div.row", {}, h("b", {}, `${l.name} · ${l.native}`), chip, h("span.muted", {}, l.script + " script"),
          h("span", { style: "margin-left:auto" }), sel, h("button", { onclick: () => act(() => api(`languages/${l.code}`, { body: { status: sel.value } }), `${l.name}: ${STATUS[sel.value]}`) }, "Set")),
        l.gaps.length ? h("div", {}, h("div.muted", {}, "Before it can go live:"), h("ul", {}, l.gaps.map((g) => h("li", {}, g)))) : h("p.muted", {}, "Ready to go live."),
        h("details", { open: l.status !== "off" ? true : null }, h("summary", {}, `Distress phrases (${l.distress.phrases.length})`),
          h("p.muted", {}, "One per line, in the script and in Roman letters as people type them. Messages containing any of these get the helpline card and alert the safety queue. These count for safety even before review."),
          list,
          h("div.muted", {}, l.distress.reviewedBy ? `Reviewed by ${l.distress.reviewedBy} on ${l.distress.reviewedOn}. Changing the list clears this.` : (l.distress.note || "Not reviewed yet.")),
          h("div.row", { style: "margin-top:8px" }, h("button", { onclick: () => saveList(false) }, "Save list"), reviewer, h("button.primary", { onclick: () => saveList(true) }, "Save and mark reviewed"))),
        h("div.muted", { style: "font-family:" + l.fonts.replace(/"/g, "'") }, "Fonts: " + l.fonts));
    })];
};

    !d.bound ? h("div.card", {}, "No backup bucket is bound. Check r2_buckets in wrangler.jsonc.") : null,

    h("div.card.scroll", {}, d.backups.length ? h("table", {}, h("tr", {}, h("th", {}, "When"), h("th", {}, "Why"), h("th", {}, "Rows"), h("th", {}, "Size"), h("th", {}, "")),
      d.backups.map((b) => h("tr", {}, h("td", {}, when(b.uploaded)), h("td", {}, b.reason), h("td", {}, num(b.rows)), h("td", {}, `${Math.ceil(b.size / 1024)} KB`),
        h("td", {}, h("button", { onclick: async () => { try { const r = await api("backups/file?key=" + encodeURIComponent(b.key), { raw: true }); download(b.key.split("/").pop(), await r.text()); toast("Backup downloaded", "ok"); } catch (e) { toast(e.message, "err"); } } }, "Download"), " ",
          h("button.danger", { onclick: () => { const c = prompt(`Restore the backup from ${when(b.uploaded)}?\n\nContent and community data will be replaced. A backup of the current state is taken first.\n\nType RESTORE to confirm.`); if (c) act(() => api("backups/restore", { body: { key: b.key, confirm: c } }), (r) => `Restored. Taken first: ${r.takenFirst.split("/").pop()}`); } }, "Restore…"))))) : h("p.muted", {}, "No backups yet.")),
