<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aspiran for coaching centres</title>
<!--KIT-->
<style>
  /* Console-only bits. --brand follows the institute's colour once it's set. */
  .k-doubt { padding:14px 16px; }
  .k-doubt .quote { margin:8px 0 10px; }
  .k-replies { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .k-msg { padding:10px 0; border-top:1px solid var(--line); }
  .k-msg:first-child { border-top:0; }
  .k-msg.hidden { opacity:.5; }
  .k-msg .k-mt { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; }
  .k-msg .k-mt b { font-size:14px; }
  .k-msg .k-mx { margin-top:3px; white-space:pre-wrap; word-break:break-word; }
  .k-batches { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:14px; margin-bottom:20px; }
  .k-batch h3 { margin:0 0 2px; font-size:16px; }
  .k-batch .k-bn { font-size:30px; font-weight:700; line-height:1.1; margin-top:10px; }
  .k-batch.closed { opacity:.65; }
  .item { border-top:1px solid var(--line); padding:10px 0; display:grid; grid-template-columns:150px 120px 1fr auto; gap:8px; align-items:start; }
  .item input[type=text] { width:100%; margin-top:6px; }
  @media (max-width:760px) { .item { grid-template-columns:1fr 1fr; } .item > div { grid-column:1 / -1; } }
  .k-preview { border:1px solid var(--line); border-radius:16px; overflow:hidden; max-width:360px; background:var(--bg); }
  .k-preview .k-pv-top { display:flex; gap:10px; align-items:center; padding:12px 14px; color:#fff; }
  .k-preview .k-pv-top img { width:34px; height:34px; border-radius:8px; background:#fff; object-fit:contain; }
  .k-preview .k-pv-body { padding:14px; font-size:13px; color:var(--muted); }
  .k-preview .k-pv-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; color:var(--ink); }
  .k-two { display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr); gap:14px; align-items:start; }
  @media (max-width:980px) { .k-two { grid-template-columns:1fr; } }
  .k-progress { display:flex; align-items:center; gap:10px; margin:2px 0 10px; }
</style>
</head>
<body>
<header class="k-top">
  <a class="k-brand" href="#dashboard"><span class="k-mark" id="mark">A</span><span><div class="k-title" id="title">Aspiran for coaching centres</div><div class="k-sub" id="subtitle">Coaching centre console</div></span></a>
  <div class="k-who" id="who"></div>
</header>
<div class="k-shell" id="layout" hidden>
  <div id="nav"></div>
  <main class="k-main" id="main"></main>
</div>
<div id="gate"></div>
<script type="module">
import * as Auth from "/app/auth.js";
import { NODES, PAPERS } from "/app/syllabus.js";
const { $, h, put, icon, num, when, day, ago, pct, initials, toast, busy, copy, modal, confirm, pageHead, card, empty, loading, kpi, bars, meter, seg, table, sideNav, list } = Kit;

const todayIso = () => new Date(Date.now() + 5.5 * 3600_000).toISOString().slice(0, 10);
const ROLE = { owner: "Owner", admin: "Admin", teacher: "Teacher", student: "Student" };
const rank = (r) => ({ student: 1, teacher: 2, admin: 3, owner: 4 })[r] ?? 0;

async function api(path, body, method) {
  const t = await Auth.getToken();
  let r;
  try { r = await fetch(path, { method: method ?? (body ? "POST" : "GET"), headers: { "content-type": "application/json", ...(t ? { authorization: "Bearer " + t } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch { throw new Error("Can't reach Aspiran. Check your internet connection and try again. Nothing was changed."); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(Kit.friendly(d.error ?? "", r.status)), { status: r.status });
  return d;
}
async function fetchBlob(path) {
  const r = await fetch(path, { headers: { authorization: "Bearer " + (await Auth.getToken()) } });
  if (!r.ok) throw new Error("Couldn't get that file. Try again.");
  return r.blob();
}

/** A topic picker built from the same syllabus list as the app's garden. */
function topicSelect(value = "", { blank = "No topic" } = {}) {
  return h("select", { "aria-label": "Topic" }, h("option", { value: "" }, blank),
    PAPERS.map((p) => h("optgroup", { label: p.short }, NODES.filter((n) => n.paper.id === p.id).map((n) => h("option", { value: n.id, selected: n.id === value }, n.name)))));
}
const topicName = (id) => NODES.find((n) => n.id === id)?.name ?? "";

// --- Sign-in ------------------------------------------------------------------------------------------------
let cfg = null;
const S = { tab: location.hash.slice(1) || "dashboard", st: {} };
async function boot() {
  cfg = await fetch("/config").then((r) => r.json()).catch(() => null);
  if (!cfg) return showGate(gateCard("Can't reach Aspiran", "Check your connection and reload the page."));
  await Auth.init(cfg.auth);
  if (!cfg.flags?.institutes) return showGate(gateCard("Not open yet", "Aspiran for coaching centres isn't switched on yet. We'll tell you the day it opens.", staffNote()));
  if (!Auth.signedIn()) return signInScreen();
  await load();
}
const gateCard = (title, text, ...more) => h("div.k-signin", h("div.card", h("span.k-mark", "A"), h("h2", title), h("p.muted", text), more));
const staffNote = () => h("div.k-foot", "Aspiran staff: set up and pause institutes in ", h("a", { href: "/admin#institutes" }, "Admin → Coaching centres"), ".");
function signInScreen(note) {
  const email = h("input", { type: "email", placeholder: "you@example.com", "aria-label": "Email for a dev sign-in", autocomplete: "email" });
  const banner = h("div.banner.err", { role: "alert" }, note || "");
  const go = busy(async () => { banner.textContent = ""; try { Auth.devSignIn(email.value); await Auth.establish(); await load(); } catch (e) { banner.textContent = e.message; } });
  email.addEventListener("keydown", (e) => e.key === "Enter" && go());
  showGate(h("div.k-signin", h("div.card", h("span.k-mark", "A"), h("h2", "Sign in to your centre"),
    h("p.muted", "Use the Aspiran account you use in the app. New teacher? Your institute's admin gives you a code to join."),
    Auth.mode() === "dev"
      ? h("div", h("label.f", { for: "em" }, "Email (local server: any email signs in)"), Object.assign(email, { id: "em" }), banner, h("button.primary", { onclick: go }, "Sign in"))
      : Auth.mode() === "firebase" ? h("div", banner, h("button.primary", { onclick: busy(async () => { await Auth.signInGoogle(); await Auth.establish(); await load(); }) }, "Continue with Google"))
      : h("p.banner.warn", "Sign-in isn't set up on this server."),
    staffNote())));
  setTimeout(() => email.focus(), 0);
}
function showGate(node) { $("#layout").hidden = true; put($("#gate"), node); }

// --- Loading the institute -------------------------------------------------------------------------------------
async function load() {
  const label = Auth.session()?.label ?? "";
  put($("#who"), h("span.k-avatar", initials(label.replace(/^Dev sign-in as /, ""))), h("span.k-name", label),
    h("button.sm.ghost", { onclick: busy(async () => { await Auth.signOut(); location.hash = ""; location.reload(); }) }, icon("out"), "Sign out"));
  let ov;
  try { ov = await api("/inst/admin/overview"); }
  catch (e) {
    if (e.status === 404 || e.status === 403) return joinScreen(e.message);
    throw e;
  }
  S.ov = ov;
  applyBrand(ov.institute);
  $("#gate").replaceChildren();
  $("#layout").hidden = false;
  route();
}
function applyBrand(inst) {
  const root = document.documentElement.style;
  if (inst.color) { root.setProperty("--brand", inst.color); root.setProperty("--brand-ink", inkFor(inst.color)); root.setProperty("--bar", inst.color); }
  put($("#mark"), inst.logo ? h("img", { src: inst.logo + "?v=" + Date.now(), alt: "" }) : initials(inst.name).slice(0, 1));
  put($("#title"), inst.name);
  put($("#subtitle"), [inst.city, "with Aspiran"].filter(Boolean).join(" · "));
  document.title = inst.name + " · Aspiran";
}
/** White or near-black text on the institute's colour, whichever reads better. */
function inkFor(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.4 ? "#1A1410" : "#FFFFFF";
}
function joinScreen(why) {
  const code = h("input", { type: "text", placeholder: "KXR7-M2PD", maxlength: 9, id: "jc", autocomplete: "off", style: { textTransform: "uppercase", letterSpacing: "2px" } });
  const name = h("input", { type: "text", placeholder: "e.g. Priya Rao", maxlength: 40, id: "jn" });
  const ok = h("input", { type: "checkbox" }), adult = h("input", { type: "checkbox" });
  const banner = h("div.banner.err", { role: "alert" });
  showGate(h("div.k-signin", h("div.card", h("span.k-mark", "A"), h("h2", "Join your institute"),
    h("p.muted", why && why !== "You're not in a coaching centre on Aspiran." ? why : "You're signed in, but not part of an institute yet. Type the code your institute gave you. Owners get theirs from Aspiran."),
    h("label.f", { for: "jc" }, "Code"), code, h("label.f", { for: "jn" }, "Your name, as the institute will see it"), name,
    h("label.check", { style: { marginTop: "12px" } }, ok, h("span.muted", "I understand the institute will see my name, batch, activity since joining, my answers to its question sets, my doubts and my messages in its chat. Never my pod or Chotu chats, journal or my own practice.")),
    h("label.check", adult, h("span.muted", "I'm 18 or older.")), banner,
    h("button.primary", { onclick: busy(async () => { banner.textContent = ""; try { await api("/inst/join", { code: code.value, displayName: name.value, consent: ok.checked, adult: adult.checked }); toast("You've joined."); await load(); } catch (e) { banner.textContent = e.message; } }) }, "Join"),
    staffNote())));
}

// --- Navigation -------------------------------------------------------------------------------------------------
const GROUPS = [
  ["Today", [["dashboard", "Dashboard", "home"], ["doubts", "Doubts", "help"], ["chat", "Chat and announcements", "chat"]]],
  ["Students", [["batches", "Batches and invites", "layers"], ["people", "People", "users"], ["plans", "Study plans", "calendar"], ["content", "Notes and tests", "book"]]],
  ["Insight", [["reports", "Weekly report", "doc"], ["analytics", "Analytics", "chart"]]],
  ["Settings", [["branding", "Branding", "palette", "admin"]]],
];
const allowedTabs = () => GROUPS.flatMap(([, items]) => items).filter(([, , , need]) => rank(S.ov.role) >= rank(need ?? "teacher")).map(([id]) => id);
function drawNav() {
  const c = S.ov.counts;
  put($("#nav"), sideNav(GROUPS.map(([label, items]) => ({ label, items: items.filter(([, , , need]) => rank(S.ov.role) >= rank(need ?? "teacher"))
    .map(([id, l, ic]) => ({ id, label: l, icon: ic, count: id === "doubts" ? c.openDoubts : id === "chat" ? c.reported : 0 })) })), S.tab, (id) => go(id)));
}
const go = (id) => { if (location.hash.slice(1) === id) route(); else location.hash = id; };
window.addEventListener("hashchange", () => S.ov && route());
function route() {
  S.tab = location.hash.slice(1) || "dashboard";
  if (!allowedTabs().includes(S.tab)) S.tab = "dashboard";
  drawNav(); draw();
}
const VIEWS = {};
async function draw() {
  const main = $("#main"), tab = S.tab;
  put(main, loading());
  try { const v = await VIEWS[tab](); if (S.tab === tab) put(main, v); }
  catch (e) { put(main, card({}, h("div.banner.err", "This section didn't load. " + e.message), h("button", { onclick: () => draw() }, "Try again"))); }
}
const refresh = async () => { S.ov = await api("/inst/admin/overview"); drawNav(); await draw(); };
const batches = () => S.ov.batches.filter((b) => !b.archived_at);
const batchSelect = (value, { all = false, label = "Batch" } = {}) => h("select", { "aria-label": label }, all && h("option", { value: "" }, "All batches"), batches().map((b) => h("option", { value: b.id, selected: b.id === value }, b.name)));
const batchName = (id) => S.ov.batches.find((b) => b.id === id)?.name ?? "";
const isAdmin = () => rank(S.ov.role) >= rank("admin");
const hello = () => { const hr = new Date().getHours(); return hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening"; };

// --- Shared dialogs: invite and announce ---------------------------------------------------------------------------
function inviteDialog(batchId) {
  if (!batches().length) return toast(isAdmin() ? "Make a batch first (Batches and invites → New batch)." : "Ask an admin to make a batch first.", "err");
  const role = h("select", { id: "ir" }, h("option", { value: "student" }, "Students"), isAdmin() && h("option", { value: "teacher" }, "Teachers"), S.ov.role === "owner" && h("option", { value: "admin" }, "Admins"));
  const forBatch = batchSelect(batchId ?? batches()[0]?.id), uses = h("input", { type: "number", value: 100, min: 1, max: 1000 }), days = h("input", { type: "number", value: 30, min: 1, max: 365 });
  const bField = h("label.field", h("span", "Batch"), forBatch);
  role.onchange = () => { bField.hidden = role.value !== "student"; uses.value = role.value === "student" ? 100 : 1; };
  const out = h("div");
  const form = h("div", h("div.fields", h("label.field", h("span", "Invite"), role), bField, h("label.field", h("span", "How many people"), uses, h("span.hint", "The code stops after this many")), h("label.field", h("span", "Works for (days)"), days)), out);
  modal("Invite people", form, [(close) => h("button.primary", { onclick: busy(async (e) => {
    const d = await api("/inst/admin/codes", { role: role.value, batchId: role.value === "student" ? forBatch.value : null, maxUses: Number(uses.value), days: Number(days.value) });
    const link = `${location.origin}/app/#inst/${d.code.replace("-", "")}`;
    const msg = `Join ${S.ov.institute.name} on Aspiran: open ${link} or type the code ${d.code} in the app (Me → Coaching centre).`;
    put(out, h("div.banner.ok", h("div", "Here's the code. It works for ", d.days, " days, for up to ", d.maxUses, d.maxUses === 1 ? " person." : " people."),
      h("div.row", { style: { marginTop: "10px" } }, h("span.code", d.code)),
      h("div.row", { style: { marginTop: "10px" } }, h("button.sm", { onclick: () => copy(d.code, "Code copied") }, icon("copy"), "Copy code"), h("button.sm", { onclick: () => copy(link, "Link copied") }, icon("link"), "Copy link"),
        h("button.sm", { onclick: () => copy(msg, "Message copied") }, icon("chat"), "Copy a WhatsApp message"))));
    e.currentTarget.hidden = true;
    S.ov = await api("/inst/admin/overview");
    if (S.tab === "batches") draw();
  }) }, "Make code")]);
}
function announceDialog() {
  if (!batches().length) return toast("Make a batch first.", "err");
  const text = h("textarea", { placeholder: "e.g. Mock test 3 is on Sunday at 10.", maxlength: 1000, id: "an" });
  const to = h("select", h("option", { value: "" }, "Every batch"), batches().map((b) => h("option", { value: b.id }, b.name)));
  modal("Post an announcement", h("div", h("label.field", h("span", "Announcement"), text, h("span.hint", "Students see it at the top of their batch chat.")), h("label.field", h("span", "To"), to)),
    [(close) => h("button.primary", { onclick: busy(async () => {
      const d = await api("/inst/chat", { text: text.value, batchId: to.value || null, announce: true });
      if (d.held) { toast("Not posted: it read like someone may be in distress. Aspiran's care team has it.", "err"); return; }
      close(); toast("Announcement posted."); if (S.tab === "dashboard" || S.tab === "chat") draw();
    }) }, "Post")]);
  setTimeout(() => text.focus(), 0);
}

// --- Dashboard ---------------------------------------------------------------------------------------------------
VIEWS.dashboard = async () => {
  const d = await api("/inst/admin/dashboard");
  const t = d.totals, c = d.checklist;
  const steps = [
    [c.batch, "Make your first batch", "Each batch has its own chat and plan.", "batches"],
    [c.teacher, "Invite a teacher", "Teachers answer doubts and post announcements.", "batches"],
    [c.students, "Invite students", "Share a code or link on your WhatsApp group.", "batches"],
    [c.branding, "Add your colour and logo", "Students see your name and logo in Aspiran.", "branding"],
    [c.announcement, "Post a first announcement", "Say hello, or share this week's plan.", "chat"],
    [c.content, "Publish a note or a practice set", "Only your students see it.", "content"],
    [c.plan, "Make a study plan", "Days of topics, notes and tests to tick off.", "plans"],
  ];
  const doneN = steps.filter((s) => s[0]).length;
  const daily = d.daily.map((x) => x.active);
  return h("div",
    pageHead(`${hello()}, ${S.ov.you.split(" ")[0]}`, `${S.ov.institute.name} · you're ${ROLE[S.ov.role].toLowerCase()} here.`,
      h("button", { onclick: announceDialog }, icon("megaphone"), "Announce"), h("button.primary", { onclick: () => inviteDialog() }, icon("plus"), "Invite students")),
    doneN < steps.length && card({ title: "Getting started", sub: `${doneN} of ${steps.length} done` },
      h("div.k-progress", h("div.k-bar", h("span", { style: { width: (doneN / steps.length) * 100 + "%" } }))),
      list(steps.filter(([done]) => !done).map(([, title, sub, tab]) => ({ icon: "target", title: h("b", title), sub,
        right: h("button.sm", { onclick: () => go(tab) }, "Go") })), "k-checklist")),
    h("div.tiles",
      kpi({ label: "Students", value: num(t.students), sub: `in ${batches().length} open batch${batches().length === 1 ? "" : "es"}`, go: () => go("people") }),
      kpi({ label: "Active, last 14 days", value: num(t.active14), sub: t.students ? `${Math.round((t.active14 / t.students) * 100)}% of students` : "no students yet", trend: daily, go: () => go("analytics") }),
      kpi({ label: "Doubts waiting", value: num(t.openDoubts), sub: t.oldestOpen ? `oldest asked ${ago(t.oldestOpen)}` : "all answered", tone: t.openDoubts ? "warn" : "good", go: () => go("doubts") }),
      kpi({ label: "Gone quiet (7 days)", value: num(t.quiet), sub: t.quiet ? "a short personal message helps" : "everyone's around", tone: t.quiet ? "warn" : null, go: () => { S.st.people = { f: { 2: "quiet" } }; go("people"); } }),
      kpi({ label: "Teachers and admins", value: num(S.ov.counts.staff), sub: S.ov.counts.reported ? `${S.ov.counts.reported} reported message${S.ov.counts.reported === 1 ? "" : "s"}` : "no reported messages", tone: S.ov.counts.reported ? "warn" : null, go: () => go(S.ov.counts.reported ? "chat" : "people") })),
    h("div.grid2", { style: { marginBottom: "14px" } },
      card({ title: "Doubts waiting longest", sub: "Oldest first", actions: [h("button.sm", { onclick: () => go("doubts") }, "All doubts")] },
        d.waiting.length ? list(d.waiting.map((w) => ({ icon: "help", title: w.text, sub: [w.name, batchName(w.batchId), ago(w.at), w.helperAnswered && "study helper replied"].filter(Boolean).join(" · "),
          right: h("button.sm", { onclick: () => { S.openDoubt = w.id; S.doubtStatus = "open"; go("doubts"); } }, "Answer") })))
          : empty({ icon: "check", title: "No doubts waiting", text: "New doubts from your students show here." })),
      bars("Students active each day", d.daily.map((x) => ({ label: day(x.day), v: x.active })), num, { sub: "Anything at all in Aspiran since they joined: practice, your sets, chat" })),
    batches().length ? h("div.section", h("h3", "Batches"), table([
      { key: "name", label: "Batch", render: (b) => h("b", b.name) },
      { key: "examYear", label: "Exam year", value: (b) => b.examYear ?? "" },
      { key: "students", label: "Students", num: true },
      { key: "active", label: "Active (14 days)", value: (b) => (b.students ? Math.round((b.active14 / b.students) * 100) : null), render: (b) => meter(b.students ? Math.round((b.active14 / b.students) * 100) : null) },
      { key: "quiet", label: "Gone quiet", num: true, render: (b) => (b.quiet ? h("span.chip.warn", b.quiet) : "0") },
      { key: "openDoubts", label: "Doubts waiting", num: true, render: (b) => (b.openDoubts ? h("span.chip.bad", b.openDoubts) : "0") },
      { key: "act", label: "", sort: false, csv: false, render: (b) => h("button.sm", { onclick: () => inviteDialog(b.id) }, "Invite") },
    ], { rows: d.batches, noun: "batches" })) : null,
    card({ title: "Lately" }, d.recent.length ? list(d.recent.map((r) => ({
      icon: { joined: "user", doubt: "help", announcement: "megaphone", answered: "check" }[r.kind],
      title: { joined: `${r.name} joined as ${ROLE[r.role]?.toLowerCase() ?? r.role}${r.batchId ? " in " + batchName(r.batchId) : ""}`, doubt: `${r.name} asked: “${r.text}”`,
        announcement: `${r.name} announced: “${r.text}”`, answered: `${r.name} answered a doubt` }[r.kind],
      sub: ago(r.at) }))) : empty({ icon: "activity", title: "Nothing yet", text: "Joins, doubts and announcements show here." })));
};

// --- Batches and invite codes -----------------------------------------------------------------------------------
VIEWS.batches = async () => {
  const { codes } = await api("/inst/admin/codes");
  const live = (id) => codes.filter((c) => c.live && c.batch_id === id);
  const newBatch = () => {
    const name = h("input", { type: "text", placeholder: "e.g. Prelims 2027 morning", maxlength: 60 }), year = h("input", { type: "number", placeholder: "2027", min: 2025, max: 2040 });
    modal("New batch", h("div.fields", h("label.field", h("span", "Name"), name), h("label.field", h("span", "Exam year (optional)"), year)),
      [(close) => h("button.primary", { onclick: busy(async () => { await api("/inst/admin/batches", { name: name.value, examYear: year.value || null }); close(); toast("Batch made. Next: invite students to it."); await refresh(); }) }, "Make batch")]);
    setTimeout(() => name.focus(), 0);
  };
  const rename = (b) => {
    const name = h("input", { type: "text", value: b.name, maxlength: 60 });
    modal("Rename batch", h("label.field", h("span", "Name"), name), [(close) => h("button.primary", { onclick: busy(async () => { await api(`/inst/admin/batches/${b.id}`, { name: name.value }); close(); toast("Renamed."); await refresh(); }) }, "Save")]);
  };
  const toggle = (b) => busy(async () => {
    if (!b.archived_at && !(await confirm({ title: `Close ${b.name}?`, text: "Its codes stop working and it leaves the batch lists. Students and their work stay. You can reopen it.", ok: "Close batch", danger: true }))) return;
    await api(`/inst/admin/batches/${b.id}`, { archived: !b.archived_at }); toast(b.archived_at ? "Reopened." : "Closed."); await refresh();
  });
  S.st.codes ??= {};
  return h("div",
    pageHead("Batches and invites", "Each batch has its own chat and study plan. Students join a batch with its code or link.",

    body = { node: h("div", h("label.field", h("span", "English"), en), h("label.field", h("span", "Hindi (optional)"), hi)), get: () => ({ en: { body: en.value }, ...(hi.value.trim() ? { hi: { body: hi.value } } : {}) }) };
  } else {

      field(q.en, "question", "textarea"), h("div.muted", { style: { margin: "8px 0 4px" } }, "Options: tick the right one"),
      q.en.options.map((_, j) => h("div.row", { style: { marginBottom: "6px", flexWrap: "nowrap" } }, h("input", { type: "radio", name: "a" + i, "aria-label": `Option ${"ABCDEF"[j]} is right`, checked: q.en.answerIndex === j, onchange: () => { q.en.answerIndex = j; if (q.hi) q.hi.answerIndex = j; } }), optField(q.en.options, j))),
      h("label.field", { style: { marginTop: "8px" } }, h("span", "Why (shown after answering)"), field(q.en, "explanation", "textarea")))),
      h("button", { onclick: () => { qs.push({ en: { question: "", options: ["", "", "", ""], answerIndex: 0, explanation: "" } }); drawQs(); } }, icon("plus"), "Add question"));

    h("label.field", h("span", "Title"), title), h("div.fields", h("label.field", h("span", "Syllabus topic"), topic), h("label.field", h("span", "For"), forB), h("label.field", h("span", "Status"), status)), body.node,

      await api(c ? `/inst/admin/content/${c.id}` : "/inst/admin/content", { kind, title: title.value, nodeId: topic.value || null, batchId: forB.value || null, status: status.value, data: body.get() });
      toast(status.value === "published" ? "Saved and published." : "Saved as a draft."); draw();
    }) }, "Save"), h("span.spacer"), c && h("button.danger", { onclick: busy(async () => { if (!(await confirm({ title: `Delete “${c.title}”?`, text: "Students' answers to it go too.", ok: "Delete", danger: true }))) return; await api(`/inst/admin/content/${c.id}`, { delete: true }); toast("Deleted."); draw(); }) }, "Delete"))));

const field = (obj, key, tag) => { const el = h(tag, { value: obj[key] ?? "", placeholder: key === "question" ? "The question" : "Explanation", "aria-label": key === "question" ? "Question" : "Explanation", style: { width: "100%" } }); el.oninput = () => (obj[key] = el.value); return el; };
const optField = (opts, j) => { const el = h("input", { type: "text", value: opts[j], placeholder: `Option ${"ABCDEF"[j]}`, "aria-label": `Option ${"ABCDEF"[j]}`, style: { flex: 1 } }); el.oninput = () => (opts[j] = el.value); return el; };
function importPack() {
