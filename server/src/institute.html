<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aspiran for coaching centres</title>
<style>
  /* Same look as /admin and /desk. --brand follows the institute's colour once it's set. */
  :root { --bg:#FFF8F3; --card:#fff; --ink:#221A14; --muted:#6B5D52; --line:#E8DDD3; --brand:#8D4F01; --brand-ink:#fff; --bar:#B5651D; --amber:#FCE8C3; --ok:#E3F1E1; --okInk:#2E7D32; --bad:#F8E1DE; --badInk:#B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1A1410; --card:#251D17; --ink:#F0E6DD; --muted:#B8A99C; --line:#3A2F27; --brand:#FFB870; --brand-ink:#1A1410; --bar:#E8A060; --amber:#4A3712; --ok:#22361F; --okInk:#8BD18F; --bad:#43201B; --badInk:#F2A49B; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Noto Sans Devanagari", sans-serif; }
  header { position:sticky; top:0; z-index:3; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; color:var(--brand); display:flex; gap:10px; align-items:center; }
  header h1 img { height:32px; width:32px; object-fit:contain; border-radius:6px; }
  header .with { font-size:12px; color:var(--muted); font-weight:400; }
  #who { margin-left:auto; font-size:13px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .layout { display:grid; grid-template-columns:200px 1fr; max-width:1280px; margin:0 auto; }
  nav { padding:12px 8px; position:sticky; top:56px; align-self:start; }
  nav button { display:block; width:100%; text-align:left; border:0; background:none; padding:7px 10px; border-radius:8px; color:var(--ink); }
  nav button.on { background:var(--amber); font-weight:600; }
  nav .count { float:right; background:var(--badInk); color:#fff; border-radius:999px; font-size:11px; padding:0 7px; }
  @media (max-width:800px) { .layout { grid-template-columns:1fr; } nav { position:static; display:flex; flex-wrap:wrap; gap:4px; } nav button { width:auto; } }
  main { padding:16px; min-width:0; }
  h2 { margin:0 0 4px; font-size:20px; } h3 { margin:16px 0 6px; font-size:16px; }
  p.lead { margin:0 0 16px; color:var(--muted); }
  input, textarea, select, button { font:inherit; color:inherit; }
  input, textarea, select { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; max-width:100%; }
  textarea { width:100%; min-height:90px; }
  button { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
  button.danger { border-color:var(--badInk); color:var(--badInk); }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .between { justify-content:space-between; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-bottom:16px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .tile .n { font-size:26px; font-weight:600; } .tile .l { font-size:13px; color:var(--muted); }
  .tile.warn { border-color:var(--badInk); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; border-top:0; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { overflow-x:auto; }
  .chip { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:0 8px; font-size:12px; color:var(--muted); margin-right:4px; }
  .chip.ok { background:var(--ok); color:var(--okInk); border-color:transparent; }
  .chip.bad { background:var(--bad); color:var(--badInk); border-color:transparent; }
  .chip.warn { background:var(--amber); color:var(--ink); border-color:transparent; }
  .chip.ai { background:var(--amber); color:var(--ink); border-color:transparent; font-weight:600; }
  .muted { color:var(--muted); font-size:13px; }
  .mono { font-family:ui-monospace, Consolas, monospace; }
  .code { font:600 22px ui-monospace, Consolas, monospace; letter-spacing:2px; background:var(--amber); padding:6px 12px; border-radius:8px; display:inline-block; }
  .quote { background:var(--bg); border-radius:8px; padding:8px 10px; margin:6px 0; white-space:pre-wrap; word-break:break-word; }
  .msg { padding:6px 0; border-top:1px solid var(--line); }
  .msg.hidden { opacity:.5; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; min-width:80px; }
  .bar > span { display:block; height:100%; background:var(--bar); }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:12px; }
  label.f { display:block; margin:8px 0 2px; font-size:13px; color:var(--muted); }
  .banner { border-radius:8px; padding:8px 12px; margin:10px 0; font-size:14px; }
  .banner.err { background:var(--bad); color:var(--badInk); }
  .banner.ok { background:var(--ok); color:var(--okInk); }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:none; z-index:9; width:min(560px, calc(100vw - 32px));
    background:var(--card); border:1px solid var(--line); padding:10px 14px; border-radius:10px; font-size:14px; box-shadow:0 4px 18px rgba(0,0,0,.18); }
  #toast.ok { background:var(--ok); color:var(--okInk); } #toast.err { background:var(--bad); color:var(--badInk); }
  .signin { max-width:520px; margin:48px auto; }
  .item { border-top:1px solid var(--line); padding:8px 0; display:grid; grid-template-columns:130px 110px 1fr auto; gap:8px; align-items:start; }
  @media (max-width:700px) { .item { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Aspiran for coaching centres</h1>
  <div id="who"></div>
</header>
<div class="layout" id="layout" hidden>
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div id="gate"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">
import * as Auth from "/app/auth.js";
import { NODES, PAPERS } from "/app/syllabus.js";

// --- Small helpers (text is always set as text, never parsed as HTML) ---------------------------------------
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const [name, ...cls] = tag.split(".");
  const el = document.createElement(name || "div");
  if (cls.length) el.className = cls.join(" ");
  if (attrs && (typeof attrs !== "object" || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const put = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false));
let toastTimer;
function toast(text, kind = "ok") { const t = $("#toast"); t.textContent = (kind === "ok" ? "✓ " : "⚠ ") + text; t.className = kind; t.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = "none"), 4500); }
const day = (iso) => (iso ? new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "never");
const when = (iso) => (iso ? new Date(iso).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "");
const todayIso = () => { const d = new Date(Date.now() + 5.5 * 3600_000); return d.toISOString().slice(0, 10); };
const ROLE = { owner: "Owner", admin: "Admin", teacher: "Teacher", student: "Student" };
const rank = (r) => ({ student: 1, teacher: 2, admin: 3, owner: 4 })[r] ?? 0;

async function api(path, body, method) {
  const t = await Auth.getToken();
  const r = await fetch(path, { method: method ?? (body ? "POST" : "GET"), headers: { "content-type": "application/json", ...(t ? { authorization: "Bearer " + t } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error ?? "Something went wrong. Try again."), { status: r.status });
  return d;
}
const act = (fn) => async (e) => { const b = e?.currentTarget; if (b) b.disabled = true; try { await fn(e); } catch (err) { toast(err.message, "err"); } finally { if (b) b.disabled = false; } };

/** A topic picker built from the same syllabus list as the app's garden. */
function topicSelect(value = "", { blank = "No topic" } = {}) {
  return h("select", { "aria-label": "Topic" }, h("option", { value: "" }, blank),
    PAPERS.map((p) => h("optgroup", { label: p.short }, NODES.filter((n) => n.paper.id === p.id).map((n) => h("option", { value: n.id, selected: n.id === value }, n.name)))));
}
const topicName = (id) => NODES.find((n) => n.id === id)?.name ?? "";

// --- Sign-in ------------------------------------------------------------------------------------------------
let cfg = null, S = { tab: "overview" };
async function boot() {
  cfg = await fetch("/config").then((r) => r.json()).catch(() => null);
  if (!cfg) { put($("#gate"), h("div.card.signin", "Couldn't reach Aspiran. Check your connection and reload.")); return; }
  await Auth.init(cfg.auth);
  if (!cfg.flags?.institutes) { showGate(h("div.card.signin", h("h2", "Not switched on yet"), h("p", "Aspiran for coaching centres isn't open on this server yet."), staffBox())); return; }
  if (!Auth.signedIn()) return signInScreen();
  await load();
}
function signInScreen() {
  const email = h("input", { type: "email", placeholder: "you@example.com", "aria-label": "Email for a dev sign-in" });
  showGate(h("div.card.signin", h("h2", "Sign in"), h("p.muted", "Use the same Aspiran account you use in the app. Your institute's admin gives you a code to join as a teacher."),
    Auth.mode() === "dev"
      ? h("div", h("p.muted", "Local server: a dev sign-in with any email."), h("div.row", email, h("button.primary", { onclick: act(async () => { Auth.devSignIn(email.value); await Auth.establish(); await load(); }) }, "Sign in")))
      : Auth.mode() === "firebase" ? h("button.primary", { onclick: act(async () => { await Auth.signInGoogle(); await Auth.establish(); await load(); }) }, "Continue with Google")
      : h("p", "Sign-in isn't set up on this server."),
    staffBox()));
}
function showGate(node) { $("#layout").hidden = true; put($("#gate"), node); }

/** Aspiran staff only: set up an institute and get the owner's one-time code (needs the admin key). */
function staffBox() {
  const key = h("input", { type: "password", placeholder: "Aspiran admin key", "aria-label": "Aspiran admin key", autocomplete: "off" });
  const name = h("input", { type: "text", placeholder: "Institute name" }), city = h("input", { type: "text", placeholder: "City" });
  const out = h("div");
  const call = async (path, body) => {
    const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "content-type": "application/json", authorization: "Bearer " + key.value }, body: body ? JSON.stringify(body) : undefined });
    const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error ?? "Couldn't do that."); return d;
  };
  const list = act(async () => {
    const d = await call("/admin/api/institutes");
    put(out, !d.flagOn && h("p.banner.err", "The institutes flag is off on this server (Admin → Flags)."), h("table", h("tr", h("th", "Institute"), h("th", "City"), h("th.n", "Students"), h("th.n", "Staff"), h("th", "Status"), h("th")),
      d.institutes.map((i) => h("tr", h("td", i.name), h("td", i.city ?? ""), h("td.n", i.students), h("td.n", i.staff), h("td", h("span.chip" + (i.status === "active" ? ".ok" : ".bad"), i.status)),
        h("td", h("div.row", !i.owners && h("button", { onclick: act(async () => { const r = await call(`/admin/api/institutes/${i.id}/owner-code`, {}); toast("Owner code: " + r.ownerCode); }) }, "New owner code"),
          h("button", { onclick: act(async () => { await call(`/admin/api/institutes/${i.id}/status`, { status: i.status === "active" ? "paused" : "active" }); list(); }) }, i.status === "active" ? "Pause" : "Resume")))))));
  });
  return h("details", { style: { marginTop: "24px" } }, h("summary", "Aspiran staff: set up an institute"),
    h("p.muted", "Makes the institute and a one-time owner code (30 days). Give the code to the centre's head."),
    key, h("div.row", { style: { marginTop: "8px" } }, name, city, h("button.primary", { onclick: act(async () => {
      const d = await call("/admin/api/institutes", { name: name.value, city: city.value });
      put(out, h("div.banner.ok", "Made. Owner code: ", h("span.code", d.ownerCode)));
    }) }, "Create"), h("button", { onclick: list }, "List institutes")), out);
}

// --- Loading the institute -------------------------------------------------------------------------------------
async function load() {
  put($("#who"), h("span", Auth.session()?.label ?? ""), h("button", { onclick: act(async () => { await Auth.signOut(); location.reload(); }) }, "Sign out"));
  let ov;
  try { ov = await api("/inst/admin/overview"); }
  catch (e) {
    if (e.status === 404 || e.status === 403) return joinScreen(e.message);
    throw e;
  }
  S.ov = ov;
  applyBrand(ov.institute);
  $("#gate").replaceChildren();
  $("#layout").hidden = false;
  drawNav(); draw();
}
function applyBrand(inst) {
  if (inst.color) { document.documentElement.style.setProperty("--brand", inst.color); document.documentElement.style.setProperty("--brand-ink", inkFor(inst.color)); }
  put($("#title"), inst.logo && h("img", { src: inst.logo + "?v=" + Date.now(), alt: "" }), h("span", inst.name), h("span.with", "with Aspiran"));
  document.title = inst.name + " · Aspiran";
}
/** White or near-black text on the institute's colour, whichever reads better. */
function inkFor(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.4 ? "#1A1410" : "#FFFFFF";
}
function joinScreen(why) {
  const code = h("input", { type: "text", placeholder: "KXR7-M2PD", maxlength: 9, "aria-label": "Code", style: { textTransform: "uppercase" } });
  const name = h("input", { type: "text", placeholder: "Your name as the institute should see it", maxlength: 40 });
  const ok = h("input", { type: "checkbox", id: "c1" }), adult = h("input", { type: "checkbox", id: "c2" });
  showGate(h("div.card.signin", h("h2", "Join your institute"),
    h("p.muted", why && why !== "You're not in a coaching centre on Aspiran." ? why : "You're signed in, but not part of an institute yet. Type the code your institute gave you (the owner gets one from Aspiran)."),
    h("label.f", "Code"), code, h("label.f", "Your name"), name,
    h("p", h("label", ok, " I understand the institute will see my name, batch, activity since joining, my answers to its question sets, my doubts and messages in its chat. Never my pod or Chotu chats, journal or my own practice.")),
    h("p", h("label", adult, " I'm 18 or older.")),
    h("button.primary", { onclick: act(async () => { await api("/inst/join", { code: code.value, displayName: name.value, consent: ok.checked, adult: adult.checked }); toast("Joined."); await load(); }) }, "Join"),
    staffBox()));
}

// --- Navigation -------------------------------------------------------------------------------------------------
const TABS = [
  ["overview", "Overview", "teacher"], ["batches", "Batches and codes", "teacher"], ["roster", "People", "teacher"], ["chat", "Chat", "teacher"],
  ["doubts", "Doubts", "teacher"], ["plans", "Study plans", "teacher"], ["content", "Content", "teacher"], ["analytics", "Analytics", "teacher"], ["branding", "Branding", "admin"],
];
function drawNav() {
  const role = S.ov.role;
  put($("#nav"), TABS.filter(([, , need]) => rank(role) >= rank(need)).map(([id, label]) =>
    h("button" + (S.tab === id ? ".on" : ""), { onclick: () => { S.tab = id; drawNav(); draw(); } }, label,
      id === "doubts" && S.ov.counts.openDoubts ? h("span.count", S.ov.counts.openDoubts) : null,
      id === "chat" && S.ov.counts.reported ? h("span.count", S.ov.counts.reported) : null)));
}
const VIEWS = {};
async function draw() {
  const main = $("#main");
  put(main, h("p.muted", "Loading…"));
  try { put(main, await VIEWS[S.tab]()); } catch (e) { put(main, h("div.banner.err", e.message)); }
}
const refresh = async () => { S.ov = await api("/inst/admin/overview"); drawNav(); draw(); };
const batches = () => S.ov.batches.filter((b) => !b.archived_at);
const batchSelect = (value, { all = false, label = "Batch" } = {}) => h("select", { "aria-label": label }, all && h("option", { value: "" }, "All batches"), batches().map((b) => h("option", { value: b.id, selected: b.id === value }, b.name)));
const batchName = (id) => S.ov.batches.find((b) => b.id === id)?.name ?? "";
const isAdmin = () => rank(S.ov.role) >= rank("admin");

// --- Overview ----------------------------------------------------------------------------------------------------
VIEWS.overview = async () => {
  const c = S.ov.counts;
  const a = await api("/inst/admin/analytics");
  return h("div", h("h2", "Overview"), h("p.lead", `You're ${ROLE[S.ov.role].toLowerCase()} here, as ${S.ov.you}.`),
    h("div.tiles", tile(c.students, "students"), tile(a.active, "active in the last 14 days"), tile(c.staff, "teachers and admins"), tile(batches().length, "open batches"),
      tile(c.openDoubts, "doubts waiting", c.openDoubts > 0), tile(a.quiet.length, "students gone quiet (7 days)", a.quiet.length > 0)),
    !batches().length && h("div.card", h("strong", "Start here: "), isAdmin() ? "make a batch, then a student code for it." : "ask an admin to make a batch."),
    a.quiet.length > 0 && h("div.card", h("h3", "Gone quiet"), h("p.muted", "Nothing at all for 7 days or more. A short personal message usually works better than a reminder."),
      h("table", h("tr", h("th", "Student"), h("th", "Last active")), a.quiet.map((q) => h("tr", h("td", q.name), h("td", day(q.lastActive)))))));
};
const tile = (n, l, warn) => h("div.tile" + (warn ? ".warn" : ""), h("div.n", n), h("div.l", l));

// --- Batches and invite codes -----------------------------------------------------------------------------------
VIEWS.batches = async () => {
  const { codes } = await api("/inst/admin/codes");
  const name = h("input", { type: "text", placeholder: "e.g. Prelims 2027 morning" }), year = h("input", { type: "number", placeholder: "2027", min: 2025, max: 2040, style: { width: "90px" } });
  const role = h("select", h("option", { value: "student" }, "Students"), isAdmin() && h("option", { value: "teacher" }, "Teachers"), S.ov.role === "owner" && h("option", { value: "admin" }, "Admins"));
  const forBatch = batchSelect(batches()[0]?.id), uses = h("input", { type: "number", value: 100, min: 1, max: 1000, style: { width: "90px" } }), days = h("input", { type: "number", value: 30, min: 1, max: 365, style: { width: "80px" } });
  const made = h("div");
  role.onchange = () => { forBatch.disabled = role.value !== "student"; uses.value = role.value === "student" ? 100 : 1; };
  return h("div", h("h2", "Batches and codes"), h("p.lead", "Each batch has its own chat and plan. Students join a batch with its code."),
    h("div.card", h("h3", "Batches"),
      h("table", h("tr", h("th", "Batch"), h("th", "Exam year"), h("th.n", "Students"), h("th")),
        S.ov.batches.map((b) => h("tr", h("td", b.name, b.archived_at && h("span.chip", "closed")), h("td", b.exam_year ?? ""), h("td.n", b.students),
          h("td", isAdmin() && h("button", { onclick: act(async () => { await api(`/inst/admin/batches/${b.id}`, { archived: !b.archived_at }); await refresh(); }) }, b.archived_at ? "Reopen" : "Close"))))),
      isAdmin() && h("div.row", { style: { marginTop: "10px" } }, name, year, h("button.primary", { onclick: act(async () => { await api("/inst/admin/batches", { name: name.value, examYear: year.value || null }); toast("Batch made."); await refresh(); }) }, "Add batch"))),
    h("div.card", h("h3", "Make a code"),
      h("div.row", h("label", "For ", role), h("label", "Batch ", forBatch), h("label", "Uses ", uses), h("label", "Days ", days),
        h("button.primary", { onclick: act(async () => {
          const d = await api("/inst/admin/codes", { role: role.value, batchId: role.value === "student" ? forBatch.value : null, maxUses: Number(uses.value), days: Number(days.value) });
          const link = `${location.origin}/app/#inst/${d.code.replace("-", "")}`;
          put(made, h("div.banner.ok", "Code: ", h("span.code", d.code), h("div.muted", "Students can also open ", h("span.mono", link))));
          VIEWS.batches().then((v) => { put($("#main"), v); $("#main").prepend(made); });
        }) }, "Make code")), made),
    h("div.card", h("h3", "Codes"), codes.length ? h("div.scroll", h("table", h("tr", h("th", "Code"), h("th", "For"), h("th", "Batch"), h("th.n", "Used"), h("th", "Ends"), h("th")),
      codes.map((c) => h("tr", h("td.mono", c.code), h("td", ROLE[c.role]), h("td", batchName(c.batch_id)), h("td.n", `${c.uses} of ${c.max_uses}`), h("td", day(c.expires_at)),
        h("td", c.live ? h("button.danger", { onclick: act(async () => { await api(`/inst/admin/codes/${c.code}/revoke`, {}); toast("Cancelled."); draw(); }) }, "Cancel") : h("span.chip", c.revoked_at ? "cancelled" : "ended"))))))
      : h("p.muted", "No codes yet.")));
};

// --- People -----------------------------------------------------------------------------------------------------
VIEWS.roster = async () => {
  const { people } = await api("/inst/admin/roster");
