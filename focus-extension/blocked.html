<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closed for now</title>
<style>
  :root { --bg:#FFF8F3; --card:#fff; --ink:#221A14; --muted:#6B5D52; --line:#E8DDD3; --brand:#8D4F01; --brand-ink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1A1410; --card:#251D17; --ink:#F3E9E0; --muted:#B9AA9C; --line:#3A2F27; --brand:#F0B46A; --brand-ink:#2A1A08; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 460px; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  .big { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 8px 0; }
  .muted { color: var(--muted); }
  button { font: inherit; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 10px 18px; margin: 6px; cursor: pointer; }
  button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1 id="title">Closed for now</h1>
  <p id="why" class="muted"></p>
  <div id="left" class="big"></div>
  <p>Take a breath. What were you about to study?</p>
  <div>
    <button class="primary" id="back">Back to studying</button>
    <button id="open" disabled>Open for 5 minutes</button>
  </div>
</main>
<script src="blocked.js"></script>
</body>
</html>
